<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate ELD malfunction confirmation letters easily." />
  <title>ELD Malfunction Letter Generator</title>
  <link rel="icon" href="{{ url_for('static', filename='IFTA5458.png') }}" type="image/png" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      backdrop-filter: blur(15px);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      padding: 30px;
      position: relative;
    }

    .header-logo {
      display: block;
      margin: 0 auto 10px;
      width: 60px;
      height: auto;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
      outline: none;
    }

    .form-actions {
      text-align: center;
    }

    .primary-btn {
      padding: 14px 40px;
      font-size: 1.1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      background-color: #2563eb;
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .back-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #1e293b;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .back-icon:hover {
      background-color: #0f172a;
      transform: scale(1.05);
    }

    .back-icon:focus {
      outline: 2px solid #fff;
      background-color: #2c3e50;
    }

    .back-icon::before {
      content: "\2190";
      font-size: 18px;
      margin-right: 8px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      .primary-btn {
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
      }
      .header-logo {
        width: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="{{ url_for('dashboard') }}" class="back-icon" aria-label="Back to Dashboard">Back</a>
      <img src="{{ url_for('static', filename='IFTA5458.png') }}" alt="Logo" class="header-logo">
      <h1 id="page-title">ELD Malfunction Confirmation Letter Generator</h1>
    </header>

    <form id="eld-malfunction-form" action="{{ url_for('eld_malfunction_letter') }}" method="POST" target="_blank" role="form" aria-labelledby="page-title">
      <div class="input-group">
        <label for="company_name"><i class="fa fa-building"></i> Company Name:</label>
        <input type="text" id="company_name" name="company_name" required placeholder="Enter your company name" aria-label="Company Name" />
      </div>

      <div class="input-group">
        <label for="dot_number"><i class="fa fa-hashtag"></i> DOT Number:</label>
        <input type="text" id="dot_number" name="dot_number" required placeholder="Enter your DOT number" aria-label="DOT Number" />
      </div>

      <div class="input-group">
        <label for="driver_name"><i class="fa fa-user"></i> Driver Name:</label>
        <input type="text" id="driver_name" name="driver_name" required placeholder="Enter the driver's name" aria-label="Driver Name" />
      </div>

      <div class="input-group">
        <label for="malfunction_date"><i class="fa fa-calendar"></i> Malfunction Date:</label>
        <input type="date" id="malfunction_date" name="malfunction_date" required aria-label="Malfunction Date" />
      </div>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Generate Letter</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('eld-malfunction-form').addEventListener('submit', () => {
      const btn = document.querySelector('.primary-btn');
      btn.textContent = 'Generating...';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'Generate Letter';
        btn.disabled = false;
      }, 3000);
    });
  </script>
</body>
</html>
