<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - IFTA Report Generator</title>
  <link rel="icon" href="{{ url_for('static', filename='IFTA5458.png') }}" type="image/png" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <script>
    window.onload = () => {
      const savedTheme = localStorage.getItem('theme') || 'light-theme';
      document.body.classList.add(savedTheme);
      const themeText = document.querySelector('.theme-toggle-text');
      if (themeText) themeText.textContent = savedTheme === 'dark-theme' ? 'Light' : 'Dark';

      const savedUsername = localStorage.getItem('savedUsername');
      if (savedUsername) {
        document.getElementById('username').value = savedUsername;
        document.getElementById('remember').checked = true;
      }
    };

    const toggleTheme = () => {
      const isDark = document.body.classList.contains('dark-theme');
      const newTheme = isDark ? 'light-theme' : 'dark-theme';
      document.body.classList.replace(isDark ? 'dark-theme' : 'light-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      document.querySelector('.theme-toggle-text').textContent = newTheme === 'dark-theme' ? 'Light' : 'Dark';
    };

    const togglePassword = () => {
      const password = document.getElementById('password');
      const toggle = document.getElementById('toggle-password');
      if (password.type === 'password') {
        password.type = 'text';
        toggle.textContent = 'Hide';
      } else {
        password.type = 'password';
        toggle.textContent = 'Show';
      }
    };

    const saveUsername = () => {
      const remember = document.getElementById('remember');
      const username = document.getElementById('username').value;
      remember.checked
        ? localStorage.setItem('savedUsername', username)
        : localStorage.removeItem('savedUsername');
    };

    const triggerShake = () => {
      const box = document.querySelector('.login-box');
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 500);
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #e3efff, #f7f9fc);
      transition: background 0.3s ease;
    }

    body.dark-theme {
      background: linear-gradient(135deg, #101d2e, #1e2a3a);
      color: #dbe2e9;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    .login-box {
      background-color: #fff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    body.dark-theme .login-box {
      background-color: #111a25;
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    .login-logo {
      width: 60px;
      margin-bottom: 15px;
    }

    .login-heading {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      font-size: 14px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 6px;
    }

    body.dark-theme .input-field {
      background-color: #1e2a3a;
      color: #dbe2e9;
      border: 1px solid #3c4c66;
    }

    .password-container {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #003366;
      font-size: 13px;
      cursor: pointer;
    }

    body.dark-theme .password-toggle {
      color: #dbe2e9;
    }

    .btn, .login-btn {
      background-color: #003366;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    .btn:hover, .login-btn:hover {
      background-color: #00509e;
    }

    .theme-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #003366;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      z-index: 1000;
    }

    .theme-toggle-btn:hover {
      background-color: #00509e;
    }

    .remember-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .flashes {
      list-style: none;
      padding: 0;
      margin-bottom: 15px;
    }

    .error-message {
      background-color: #fbe3e4;
      color: #e74c3c;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    body.dark-theme .error-message {
      background-color: #330000;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 20px 15px;
      }

      .login-heading {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <img src="{{ url_for('static', filename='IFTA5458.png') }}" alt="IFTA Logo" class="login-logo" />
      <div class="login-heading">Log in to your Account</div>

      <!-- 🔔 Flash Messages Block -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flashes">
            {% for message in messages %}
              <li class="error-message" onclick="triggerShake()">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="POST" autocomplete="off" onsubmit="saveUsername()">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" class="input-field" required placeholder="Enter your username" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" name="password" id="password" class="input-field" required placeholder="Enter your password" />
            <button type="button" id="toggle-password" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <div class="remember-container">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>

        <div class="g-recaptcha" data-sitekey="6LcpJVsrAAAAAFwC3XqO05l-MEZXj4A5tNDmm-xI
"></div>

        <button type="submit" class="btn login-btn">Login</button>
      </form>
    </div>
  </div>

  <button onclick="toggleTheme()" class="theme-toggle-btn">
    <span class="theme-toggle-text">Dark</span>
  </button>
</body>

  <button onclick="toggleTheme()" class="theme-toggle-btn">
    <span class="theme-toggle-text">Dark</span>
  </button>
</body>
</html>
