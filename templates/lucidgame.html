<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GameLucid Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Preload Audio -->
  <link rel="preload" href="/static/audio/coin.wav" as="audio" type="audio/wav">
  <link rel="preload" href="/static/audio/wrong.wav" as="audio" type="audio/wav">
  <link rel="preload" href="/static/audio/menu-loop.mp3" as="audio" type="audio/mp3">
   
  <link rel="preload" as="image" href="/static/backgrounds/bghome.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg1.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg2.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg3.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg4.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg5.png">

  <style>
/* Reset */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Global */
body {
  font-family: 'Space Grotesk', 'Orbitron', sans-serif;
  background: linear-gradient(160deg, #000428, #004e92);
  color: #e0f7fa;
  overflow: hidden;
  height: 100vh;
  letter-spacing: 0.6px;
  line-height: 1.6;
}

/* Firefly Background */
#firefly-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.firefly {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  width: 2px;
  height: 2px;
  opacity: 0.5;
  animation: twinkle 3.5s infinite ease-in-out alternate, moveXY 20s linear infinite;
  filter: drop-shadow(0 0 4px #0ff);
}

@keyframes twinkle {
  from { opacity: 0.3; transform: scale(1); }
  to { opacity: 1; transform: scale(1.2); }
}

@keyframes moveXY {
  0% { transform: translate(0, 0); }
  100% { transform: translate(100vw, 100vh); }
}

/* Home Screen */
#home-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2000;
  padding: 2rem;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

  /* ⬇️ Background Image Setup */
  background-image: url('./static/backgrounds/bghome.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* Optional dark overlay */
  background-color: rgba(0, 0, 0, 0.6);
  background-blend-mode: overlay;
}

.home-content {
  max-width: 700px;
  width: 100%;
  background: rgba(0, 0, 0, 0.4);
  padding: 2.5rem;
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.08);
  animation: fadeInUp 1.4s cubic-bezier(0.25, 1, 0.5, 1);
  color: #f0f0f0;
}
#home-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: inherit;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transform: scale(1.1);
  opacity: 1;
  animation: kenBurns 30s ease-in-out infinite alternate;
}

@keyframes kenBurns {
  0% { transform: scale(1.1); }
  100% { transform: scale(1.15); }
}

#stars-canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 2001;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  opacity: 0.3;
}

#blue-stars-canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1; /* Adjust depending on layers */
  pointer-events: none;
  width: 100vw;
  height: 100vh;
}

/* Darker Task Section */
.home-content h2 {
  font-size: 2.2rem;
  color: #ffffff;
  background: rgba(0, 0, 0, 0.6); /* Darkened backdrop */
  padding: 0.8rem 1.2rem;
  border-radius: 12px;
  display: inline-block;
  margin-bottom: 1.5rem;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
}

/* PRO-LEVEL Start Button */
#start-btn {
  margin-top: 2rem;
  padding: 1rem 2.6rem;
  font-size: 1.5rem;
  font-weight: 600;
  font-family: 'Segoe UI', 'Roboto', sans-serif;
  color: #f4fefc;
  background: linear-gradient(135deg, #0f3d2e, #1e7e4e, #3ed39b);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow:
    0 4px 10px rgba(0, 64, 32, 0.3),
    inset 0 0 0 1px rgba(255, 255, 255, 0.03),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(4px);
  will-change: transform, box-shadow;
}

/* Subtle Shimmer Line */
#start-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -70%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-25deg);
  animation: shimmerLine 2.6s ease-in-out infinite;
}

@keyframes shimmerLine {
  0% { left: -70%; }
  100% { left: 130%; }
}

/* Hover Interaction */
#start-btn:hover {
  transform: scale(1.02);
  box-shadow:
    0 6px 14px rgba(30, 150, 100, 0.3),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
}

#start-btn:active {
  transform: scale(0.98);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
}

/* Optional Active Click */
#start-btn:active {
  transform: scale(0.99);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) inset;
}


/* Score Panel with Enhanced Glass Effect */
#score-panel {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1rem;
  z-index: 9999;
  padding: 0.8rem 1.2rem;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  backdrop-filter: blur(10px);
  box-shadow: inset 1px 1px 10px rgba(255, 255, 255, 0.08), 0 4px 14px rgba(0, 0, 0, 0.3);
}

#score-panel div {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 1.15rem;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
  padding: 0.5rem 1rem;
  border-radius: 10px;
}

#score-panel i {
  color: #00ffff;
}
/* Game Container */
#game-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -40%);
  opacity: 1;
  width: 92vw;
  max-width: 740px;
  padding: 3rem 2.4rem;

  z-index: 100;
  border-radius: 24px;

  background: rgba(20, 24, 28, 0.65);
  backdrop-filter: blur(20px) saturate(200%);
  -webkit-backdrop-filter: blur(20px) saturate(200%);

  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.05),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04);

  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.4s ease;
}

/* Equation Box Title with Neon Gradient */
#equation-box h1 {
  font-size: clamp(2.8rem, 6vw, 4rem);
  font-weight: 800;
  text-align: center;
  margin: 2rem 0;

  background: linear-gradient(90deg, #e0f7fa, #ffffff, #d1f2eb);
  background-size: 300%;
  background-position: center;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.3),
    0 0 12px rgba(0, 255, 255, 0.2),
    0 0 22px rgba(0, 200, 180, 0.25);

  animation: gradientFlow 12s linear infinite;
}

@keyframes textGlowMaster {
  0%, 100% {
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.4),
      0 0 10px rgba(0, 255, 255, 0.1),
      0 0 18px rgba(0, 255, 204, 0.2);
  }
  50% {
    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.5),
      0 0 14px rgba(0, 255, 255, 0.25),
      0 0 26px rgba(0, 255, 204, 0.4);
  }
}

@keyframes gradientFlow {
  0% {
    background-position: 0% center;
  }
  100% {
    background-position: 200% center;
  }
}

/* Answers Buttons with Hover Effect */
#answers {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
}

#answers button {
  flex: 1 1 45%;
  padding: 1.1rem 1.5rem;
  font-size: 1.4rem;
  font-weight: 600;
  color: #fefefe;
  background: linear-gradient(135deg, #00796b, #00cba9);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  overflow: hidden;

  box-shadow:
    0 6px 16px rgba(0, 255, 170, 0.2),
    inset 0 1px 1px rgba(255, 255, 255, 0.1);
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

#answers button:hover {
  transform: translateY(-2px) scale(1.05);
  background: linear-gradient(135deg, #00bfa5, #1de9b6);
  box-shadow: 0 12px 24px rgba(0, 255, 170, 0.4);
}

#answers button::after {
  content: '';
  position: absolute;
  width: 160%;
  height: 100%;
  top: 0;
  left: -80%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.12), transparent);
  transform: skewX(-25deg);
  transition: all 0.4s ease;
  opacity: 0;
}

#answers button:hover::after {
  left: 100%;
  opacity: 1;
} 

/* Pro-Level Timer Bar */
#timer-bar {
  height: 24px;
  margin-top: 2.5rem;
  background: linear-gradient(to right, #1e1e1e, #2a2a2a);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
  box-shadow:
    inset 0 1px 3px rgba(255, 255, 255, 0.05),
    inset 0 -1px 4px rgba(0, 0, 0, 0.2),
    0 2px 6px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(6px);
}

/* Progress Fill */
#timer-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #8e0000, #c43e00, #dcdcdc);
  background-size: 200% auto;
  animation: timerPulse 4s ease-in-out infinite;
  transition: width 0.3s ease;
  border-radius: 14px;
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.05);
}

/* Subtle, Elegant Animation */
@keyframes timerPulse {
  0% {
    background-position: 0% 0%;
  }
  50% {
    background-position: 100% 0%;
  }
  100% {
    background-position: 0% 0%;
  }
}


/* Level Up Banner */
#level-up-banner {
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 1.2rem 2.5rem;
  font-size: 2rem;
  font-weight: 600;
  color: #e6fdfc;
  background: linear-gradient(135deg, rgba(0, 64, 64, 0.5), rgba(0, 128, 128, 0.2));
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  box-shadow:
    0 8px 32px rgba(0, 255, 255, 0.1),
    inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(12px);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
  animation: levelUpReveal 1.6s ease forwards;
  z-index: 10000;
  will-change: opacity, transform;
}

@keyframes levelUpReveal {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(-10px) scale(0.9);
  }
  40% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1.05);
  }
  70% {
    transform: translateX(-50%) scale(1.02);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) translateY(10px) scale(1);
  }
}

/* Professional Coin Animation */
.coin-animation {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 9999;
  opacity: 0;

  background: radial-gradient(circle at 35% 35%, #f8e58c 0%, #d4a232 60%, #7a5d1c 100%);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.3),
    inset -1px -1px 2px rgba(0, 0, 0, 0.2),
    0 2px 8px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(1px);
  animation: coinBurst 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;

  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
  will-change: transform, opacity;
}


@keyframes coinBurst {
  0% {
    transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
    opacity: 1;
    filter: blur(0);
  }
  25% {
    transform: translate(-50%, -52%) scale(1.2) rotate(120deg);
    filter: blur(0.5px);
  }
  60% {
    transform: translate(calc(-50% + 140px * (0.5 - var(--x))), calc(-50% + 140px * var(--x))) scale(1.05) rotate(240deg);
    filter: blur(0.2px);
  }
  100% {
    transform: translate(calc(-50% + 220px * (0.5 - var(--x))), calc(-50% + 220px * var(--x))) scale(0.75) rotate(360deg);
    opacity: 0;
    filter: blur(1.2px);
  }
}

/* End Screen (Glassmorphic Overlay) */
#end-screen {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  background: rgba(18, 18, 18, 0.85);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);

  color: #e0f7fa;
  font-size: 1.9rem;
  z-index: 1000;
  animation: fadeInEnd 0.8s ease-out forwards;
}

@keyframes fadeInEnd {
  0% {
    opacity: 0;
    transform: scale(0.96);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
#end-screen button {
  background: linear-gradient(135deg, #00ffc8, #0ff);
  color: #000;
  padding: 1.1rem 2.8rem;
  font-size: 1.4rem;
  border: none;
  border-radius: 18px;
  margin-top: 2.5rem;
  cursor: pointer;

  box-shadow:
    0 6px 16px rgba(0, 255, 255, 0.3),
    0 0 12px rgba(0, 255, 204, 0.4);

  transition: all 0.3s ease;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#end-screen button:hover {
  transform: scale(1.08);
  box-shadow:
    0 10px 26px rgba(0, 255, 255, 0.4),
    0 0 18px rgba(0, 255, 204, 0.6);
}

/* Miscellaneous Effects */
.flash-wrong { animation: flashRed 0.4s ease; }

@keyframes flashRed {
  0% { background-color: #ff4a4a; }
  100% { background-color: transparent; }
}

.score-increment {
  position: absolute;
  font-size: 1.4rem;
  color: #0ff;
  animation: riseFade 1s ease-out forwards;
  pointer-events: none;
  text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
}

@keyframes riseFade {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
}

.shake {
  animation: shakeAnim 0.3s ease-in-out;
}

@keyframes shakeAnim {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

audio { display: none; }

/* Countdown Circle */
#countdown-circle {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 3.2rem;
  font-weight: 800;
  color: #e0ffff;
  text-shadow:
    0 0 6px rgba(0, 255, 255, 0.4),
    0 0 12px rgba(0, 255, 255, 0.6);

  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 8px 20px rgba(0, 255, 255, 0.1),
    inset 0 0 10px rgba(255, 255, 255, 0.08);

  animation: countdownPulse 1.8s ease-in-out infinite;
  z-index: 10000;
}


@keyframes countdownPulse {
  0%, 100% {
    transform: translate(-50%, -50%) scale(1);
    box-shadow:
      0 8px 20px rgba(0, 255, 255, 0.1),
      inset 0 0 10px rgba(255, 255, 255, 0.08);
  }
  50% {
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow:
      0 12px 28px rgba(0, 255, 255, 0.25),
      inset 0 0 12px rgba(255, 255, 255, 0.12);
  }
}

.particle {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle, #a8ffff 0%, #0ff 80%, #00f 100%);
  pointer-events: none;
  opacity: 0.9;
  z-index: 9999;
  animation: explode 0.8s ease-out forwards;
  box-shadow:
    0 0 6px rgba(0, 255, 255, 0.3),
    0 0 12px rgba(0, 100, 255, 0.2);
}

@keyframes explode {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    filter: blur(0);
  }
  100% {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.6);
    filter: blur(2px);
  }
}

/* Responsive */
@media (max-width: 768px) {
  #equation-box h1 {
    font-size: 2.3rem;
  }
  #answers button {
    font-size: 1.2rem;
    padding: 1rem;
    max-width: 100%;
  }
  #score-panel {
    flex-direction: column;
    gap: 0.6rem;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
  }
}

#dynamic-bg,
#hero-particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  pointer-events: none;
}
#mute-btn {
  position: fixed;
  top: 20px;
  right: 24px;
  width: 48px;
  height: 48px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  border: none;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
  color: #0ff;
  font-size: 1.4rem;
  cursor: pointer;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

#mute-btn:hover {
  box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
  transform: scale(1.05);
}

#mute-btn i {
  transition: all 0.3s ease;
}

#dynamic-bg {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    #bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/static/backgrounds/bghome.png');
      background-size: cover;
      background-position: center;
      z-index: -2;
      opacity: 1;
    }

    canvas#firefly-bg,
    canvas#hero-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
#game-container {
  opacity: 1 !important;
}
  </style>
</head>
<body>
<!-- Background elements -->
<canvas id="firefly-bg"></canvas>
<canvas id="hero-particles"></canvas>
<div id="bg-overlay"></div>

<!-- Home screen UI --> 
  
  <!-- 🌌 Stars canvas background -->
<canvas id="stars-canvas"></canvas>
<canvas id="blue-stars-canvas"></canvas>

  <!-- Main content -->
<div id="home-screen" class="hero fade-in">
  <div class="hero-content">
    <h1><i class="bi bi-controller"></i> Welcome to <span class="highlight">GameLucid Pro</span></h1>
    <p>Sharpen your mind. Collect coins. Beat your highest score!</p>

    <div class="home-info">
      <div><i class="fas fa-trophy"></i> High Score: <span id="home-high-score">0</span></div>
      <div><i class="fas fa-coins"></i> Coins: <span id="home-coins">0</span></div>
    </div>
</div>

    <div class="controls">
      <button id="start-btn"><i class="bi bi-play-circle"></i> Start Game</button>
        <button id="mute-btn" title="Toggle Sound">
        <i class="fas fa-volume-up"></i>
      </button>
    </div>
  </div>
</div>

<!-- GAME SCREEN: Wrap everything related to gameplay here -->
<div id="game-screen" style="display: none;">
  <!-- Score Panel -->
  <div id="score-panel">
    <div><i class="fas fa-star"></i> <span id="score">0</span></div>
    <div><i class="fas fa-coins"></i> <span id="coins">0</span></div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <div id="equation-box"><h1 id="equation"></h1></div>
    <div id="answers"></div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
  </div>

<!-- Extra Effects & Banners -->
<div id="dynamic-bg" aria-hidden="true"></div>
<div id="level-up-banner" role="alert">Level Up!</div>

<!-- End Screen -->
<section id="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-screen-heading">
  <h2 id="end-screen-heading" style="display:none;">End of Game</h2>
  <p><i class="bi bi-hourglass-bottom"></i> Time's up!</p>
  <p>Your Score: <span id="final-score">0</span></p>
  <p>High Score: <span id="final-high-score">0</span></p>
  <p>Coins Earned: <span id="final-coins">0</span></p>
  <button id="restart-btn">
    <i class="bi bi-arrow-repeat"></i> Play Again
  </button>
</section>


  <audio id="coin-sound" src="/static/audio/coin.wav" preload="auto"></audio>
  <audio id="wrong-sound" src="/static/audio/wrong.wav" preload="auto"></audio>
  <audio id="bg-music" src="/static/audio/menu-loop.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];
const starCount = 160;

for (let i = 0; i < starCount; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.5 + 0.5,
    alpha: Math.random() * 0.6 + 0.4,
    alphaChange: (Math.random() * 0.02) + 0.008,
    angle: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - 0.5) * 0.01,
    dx: (Math.random() - 0.5) * 0.15,
    dy: (Math.random() - 0.5) * 0.15
  });
}

function drawStar(star) {
  ctx.save();
  ctx.translate(star.x, star.y);
  ctx.rotate(star.angle);

  const baseAlpha = star.alpha;
  const glowColor = `rgba(255, 255, 150, ${baseAlpha})`; // soft yellow glow
  const sharpColor = `rgba(255, 255, 80, ${baseAlpha})`; // bright core

  // Central circle
  ctx.globalAlpha = baseAlpha;
  ctx.fillStyle = sharpColor;
  ctx.beginPath();
  ctx.arc(0, 0, star.size, 0, Math.PI * 2);
  ctx.fill();

  // Cross lines
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 0.6;

  ctx.beginPath();
  ctx.moveTo(-star.size * 2.5, 0);
  ctx.lineTo(star.size * 2.5, 0);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -star.size * 2.5);
  ctx.lineTo(0, star.size * 2.5);
  ctx.stroke();

  // Diagonal lines
  ctx.beginPath();
  ctx.moveTo(-star.size * 1.8, -star.size * 1.8);
  ctx.lineTo(star.size * 1.8, star.size * 1.8);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(star.size * 1.8, -star.size * 1.8);
  ctx.lineTo(-star.size * 1.8, star.size * 1.8);
  ctx.stroke();

  ctx.restore();
}

function animateStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const star of stars) {
    star.alpha += star.alphaChange;
    if (star.alpha <= 0.3 || star.alpha >= 1) {
      star.alphaChange = -star.alphaChange;
    }

    star.angle += star.rotationSpeed;
    star.x += star.dx;
    star.y += star.dy;

    // Wrap around edges
    if (star.x < 0) star.x = canvas.width;
    if (star.x > canvas.width) star.x = 0;
    if (star.y < 0) star.y = canvas.height;
    if (star.y > canvas.height) star.y = 0;

    drawStar(star);
  }

  requestAnimationFrame(animateStars);
}

animateStars();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

  // 🟡 Firefly background animation (no changes)
  const fireflyCanvas = document.getElementById('firefly-bg');
  const fireflyCtx = fireflyCanvas.getContext('2d');
  fireflyCanvas.width = window.innerWidth;
  fireflyCanvas.height = window.innerHeight;
  const bugs = [...Array(100)].map(() => ({
    x: Math.random() * fireflyCanvas.width,
    y: Math.random() * fireflyCanvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.6,
    dy: (Math.random() - 0.5) * 0.6,
    alpha: Math.random() * 0.5 + 0.5
  }));
  function animateFireflies() {
    fireflyCtx.clearRect(0, 0, fireflyCanvas.width, fireflyCanvas.height);
    bugs.forEach(b => {
      fireflyCtx.beginPath();
      fireflyCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      fireflyCtx.fillStyle = `rgba(255,255,255,${b.alpha})`;
      fireflyCtx.fill();
      b.x += b.dx;
      b.y += b.dy;
      if (b.x < 0 || b.x > fireflyCanvas.width) b.dx *= -1;
      if (b.y < 0 || b.y > fireflyCanvas.height) b.dy *= -1;
    });
    requestAnimationFrame(animateFireflies);
  }
  animateFireflies();
  window.addEventListener('resize', () => {
    fireflyCanvas.width = window.innerWidth;
    fireflyCanvas.height = window.innerHeight;
  });
</script>

<script>
document.getElementById('start-btn').addEventListener('click', () => {
  const homeScreen = document.getElementById('home-screen');
  const gameScreen = document.getElementById('game-screen');

  homeScreen.style.display = 'none';
  gameScreen.style.display = 'block';

  // Ensure the animation triggers after layout
  setTimeout(() => {
    gameScreen.classList.add('show');
  }, 10);

  loadQuestion();
});

  const CONFIG = { MIN_TIMER: 1200, BASE_TIMER: 3500, DECAY_RATE: 150 };
  const DOM = {
    eqEl: document.getElementById('equation'),
    ansCon: document.getElementById('answers'),
    scoreEl: document.getElementById('score'),
    highEl: null,
    coinsEl: document.getElementById('coins'),
    timerFill: document.getElementById('timer-fill'),
    lvlBanner: document.getElementById('level-up-banner'),
    endScreen: document.getElementById('end-screen'),
    finalScore: document.getElementById('final-score'),
    finalHigh: document.getElementById('final-high-score'),
    finalCoins: document.getElementById('final-coins'),
    coinSnd: document.getElementById('coin-sound'),
    wrongSnd: document.getElementById('wrong-sound'),
    homeHighScore: document.getElementById('home-high-score'),
    homeCoins: document.getElementById('home-coins')
  };

  const scorePanel = document.getElementById('score-panel');
  const highScoreDiv = document.createElement('div');
  highScoreDiv.innerHTML = `<i class="fas fa-trophy"></i> <span id="high-score">0</span>`;
  scorePanel.appendChild(highScoreDiv);
  DOM.highEl = document.getElementById('high-score');

  let score = 0, coins = 0, level = 1, timer;
  let highScore = parseInt(localStorage.getItem('highScore') || '0');
  let totalCoins = parseInt(localStorage.getItem('totalCoins') || '0');

  DOM.highEl.textContent = highScore;

  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function evaluateExpression(expr) {
    try {
      const tokens = expr.split(' ');
      let result = parseInt(tokens[0]);
      for (let i = 1; i < tokens.length; i += 2) {
        const op = tokens[i], val = parseInt(tokens[i + 1]);
        result += (op === '+') ? val : -val;
      }
      return result;
    } catch { return 0; }
  }

  function generateEquation(lv) {
    let q;
    if (lv <= 5) q = `${rand(1, 9)} ${Math.random() > 0.5 ? '+' : '-'} ${rand(1, 9)}`;
    else if (lv <= 10) q = `${rand(1, 9)} - ${rand(1, 9)} + ${rand(1, 9)}`;
    else q = `${rand(10, 50)} ${Math.random() > 0.5 ? '+' : '-'} ${rand(10, 50)}`;
    const correct = evaluateExpression(q);
    const opts = new Set([correct]);
    while (opts.size < 4) opts.add(correct + rand(-10, 10));
    return { question: `${q} = ?`, correct, options: Array.from(opts).sort(() => Math.random() - 0.5) };
  }

  function startTimer() {
    const dur = Math.max(CONFIG.MIN_TIMER, CONFIG.BASE_TIMER - level * CONFIG.DECAY_RATE);
    DOM.timerFill.style.transition = 'none';
    DOM.timerFill.style.width = '100%';
    setTimeout(() => {
      DOM.timerFill.style.transition = `width ${dur}ms linear`;
      DOM.timerFill.style.width = '0%';
    }, 50);
    timer = setTimeout(endGame, dur);
  }

  function showLevelUp() {
    DOM.lvlBanner.style.display = 'block';
    setTimeout(() => DOM.lvlBanner.style.display = 'none', 800);
  }

  function playCoinAnimation() {
    for (let i = 0; i < 6; i++) {
      const coin = document.createElement('div');
      coin.className = 'coin-animation';
      coin.style.setProperty('--x', Math.random().toFixed(2));
      coin.style.setProperty('--delay', `${i * 0.1}s`);
      document.body.appendChild(coin);
      setTimeout(() => coin.remove(), 1200);
    }
  }

  function loadQuestion() {
    clearTimeout(timer);
    const eq = generateEquation(level);
    DOM.eqEl.textContent = eq.question;
    DOM.ansCon.innerHTML = '';
    eq.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.setAttribute('aria-label', `Answer: ${opt}`);
      btn.onclick = () => handleAnswer(opt === eq.correct);
      DOM.ansCon.appendChild(btn);
    });
    startTimer();
  }

  function handleAnswer(correct) {
    clearTimeout(timer);
    if (correct) {
      DOM.coinSnd.play().catch(() => {});
      score++; coins++; level++;
      DOM.scoreEl.textContent = score;
      DOM.coinsEl.textContent = coins;
      showLevelUp();
      playCoinAnimation();
      loadQuestion();
    } else {
      DOM.wrongSnd.play().catch(() => {});
      endGame();
    }
  }

  function endGame() {
    clearTimeout(timer);

    // Save high score if needed
    if (score > highScore) {
      localStorage.setItem('highScore', score);
      highScore = score;
      DOM.highEl.textContent = highScore;
    }

    // Save total coins
    totalCoins += coins;
    localStorage.setItem('totalCoins', totalCoins);

    // Update end screen
    DOM.finalScore.textContent = score;
    DOM.finalCoins.textContent = coins;
    DOM.finalHigh.textContent = highScore;
    DOM.endScreen.style.display = 'flex';
  }

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  loadQuestion();
});

  const muteBtn = document.getElementById('mute-btn');
  let isMuted = false;
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.innerHTML = `<i class="fas ${isMuted ? 'fa-volume-mute' : 'fa-volume-up'}"></i>`;
    document.querySelectorAll('audio').forEach(audio => audio.muted = isMuted);
  });

  // ✅ Load stats when home screen is shown
  window.onload = () => {
    const storedHighScore = localStorage.getItem('highScore') || 0;
    const storedTotalCoins = localStorage.getItem('totalCoins') || 0;
    DOM.homeHighScore.textContent = storedHighScore;
    DOM.homeCoins.textContent = storedTotalCoins;
  };
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('blue-stars-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const stars = [];
  const starCount = 120;

  for (let i = 0; i < starCount; i++) {
    const speed = (Math.random() * 0.4 + 0.1); // Random speed
    const angle = Math.random() * 2 * Math.PI; // Any direction
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 0.5 + 1.0,
      alpha: Math.random() * 0.5 + 0.6,
      alphaDir: Math.random() > 0.5 ? 1 : -1,
      pulseSpeed: Math.random() * 0.015 + 0.005,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed
    });
  }

  function drawStars() {
  if (!document.getElementById('home-screen')?.style?.display || document.getElementById('home-screen').style.display !== 'none') {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const star of stars) {
      // Alpha pulse
      star.alpha += star.pulseSpeed * star.alphaDir;
      if (star.alpha <= 0.3 || star.alpha >= 1) {
        star.alphaDir *= -1;
      }

      // Movement
      star.x += star.dx;
      star.y += star.dy;

      // Wrap around edges
      if (star.x < -20) star.x = canvas.width + 20;
      if (star.x > canvas.width + 20) star.x = -20;
      if (star.y < -20) star.y = canvas.height + 20;
      if (star.y > canvas.height + 20) star.y = -20;

      // Bright blue glow gradient
      const gradient = ctx.createRadialGradient(
        star.x, star.y, 0,
        star.x, star.y, star.size * 3
      );
      gradient.addColorStop(0, `rgba(0, 180, 255, ${star.alpha})`);
      gradient.addColorStop(0.3, `rgba(0, 180, 255, ${star.alpha * 0.4})`);
      gradient.addColorStop(1, `rgba(0, 180, 255, 0)`);

      // Outer glow
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size * 6, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      // Core dot
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 200, 255, ${star.alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(drawStars);
  }

  drawStars();
});
</script>
