<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - IFTA Report Generator</title>

    <!-- SEO + Meta -->
    <meta name="description" content="IFTA Dashboard for generating reports, managing ELD tools, and more." />
    <meta name="theme-color" content="#1f6f8b" />

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='IFTA5458.png') }}" type="image/png" />
    <noscript>
      <link rel="icon" href="/static/IFTA5458.png" type="image/png" />
    </noscript>

    <!-- Styles -->
    <style>
      :root {
        --primary: #1f6f8b;
        --primary-dark: #14506d;
        --background: #1f1f1f;
        --card-bg: #292929;
        --text: #ecf0f1;
        --accent: #30cfcf;
        --danger: #b84e4e;
        --danger-dark: #a13f3f;
        --radius: 20px;
        --transition: 0.3s ease;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--background);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        overflow-x: hidden;
      }

      header {
        text-align: center;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }

      header h1 {
        font-size: 2.8rem;
        font-weight: 700;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulseText 3s infinite;
      }

      @keyframes pulseText {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.2); }
      }

      .dashboard-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 1100px;
        margin-top: 3rem;
      }

      .dashboard-btn {
        background: linear-gradient(145deg, var(--primary), var(--primary-dark));
        border: none;
        padding: 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: var(--transition);
        position: relative;
      }

      .dashboard-btn::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.05);
        opacity: 0;
        transition: opacity var(--transition);
      }

      .dashboard-btn:hover {
        transform: translateY(-5px) scale(1.02);
      }

      .dashboard-btn:hover::after {
        opacity: 1;
      }

      #logoutBtn {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: var(--danger);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: var(--shadow);
        cursor: pointer;
        z-index: 999;
        transition: background-color var(--transition);
      }

      #logoutBtn:hover {
        background-color: var(--danger-dark);
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1001;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-content {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 400px;
        text-align: center;
        animation: fadeIn 0.3s ease;
      }

      .modal h2 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
      }

      .modal p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      .modal-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      .modal-btn {
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        background-color: var(--primary);
        border: none;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .modal-btn:hover {
        background-color: var(--primary-dark);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @media (max-width: 600px) {
        .dashboard-buttons {
          grid-template-columns: 1fr;
        }
        header h1 {
          font-size: 2rem;
        }
        #logoutBtn {
          padding: 10px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome, {{ username|e }}!</h1>
    </header>

    <div class="dashboard-buttons">
      <a href="{{ url_for('generate_report') }}" class="dashboard-btn" aria-label="Generate IFTA Report">📄 Generate IFTA Report</a>
      <a href="{{ url_for('eld_malfunction_letter') }}" class="dashboard-btn" aria-label="ELD Malfunction Letter">⚠️ ELD Malfunction Letter</a>
      <a href="{{ url_for('tutorial') }}" class="dashboard-btn" aria-label="Tutorial Viewer">🎓 Tutorial Viewer</a>
      <a href="{{ url_for('timezones') }}" class="dashboard-btn" aria-label="Time Zones">🕒 Time Zones</a>
      <a href="{{ url_for('mail_page') }}" class="dashboard-btn" aria-label="Send Email">📧 Send Email</a>
      <a href="{{ url_for('eldquiz') }}" class="dashboard-btn" aria-label="ELD Quiz">📝 ELD Quiz</a>
      <a href="{{ url_for('supportresources') }}" class="dashboard-btn" aria-label="Support Resources">🛠️ Support Resources</a>
    </div>

    <button id="logoutBtn">Logout</button>

    <div id="logoutModal" class="modal">
      <div class="modal-content">
        <h2>Confirm Logout</h2>
        <p>Are you sure you want to log out?</p>
        <div class="modal-buttons">
          <button class="modal-btn" id="confirmLogout">Yes, Logout</button>
          <button class="modal-btn" id="cancelLogout">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      const logoutBtn = document.getElementById('logoutBtn');
      const logoutModal = document.getElementById('logoutModal');
      const confirmLogout = document.getElementById('confirmLogout');
      const cancelLogout = document.getElementById('cancelLogout');

      logoutBtn.addEventListener('click', () => {
        logoutModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });

      cancelLogout.addEventListener('click', () => {
        logoutModal.style.display = 'none';
        document.body.style.overflow = 'auto';
      });

      confirmLogout.addEventListener('click', () => {
        logoutBtn.innerHTML = 'Logging out...';
        window.location.href = "{{ url_for('logout') }}";
      });

      window.addEventListener('click', (event) => {
        if (event.target === logoutModal) {
          logoutModal.style.display = 'none';
          document.body.style.overflow = 'auto';
        }
      });
    </script>
  </body>
</html>
