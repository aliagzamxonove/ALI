<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucid Games - Home</title>
  <link rel="icon" href="{{ url_for('static', filename='IFTA5458.png') }}" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
:root {
  --primary: #00ffc8;
  --primary-dark: #0cf5b0;
  --gold: #ffe46f;
  --deep: #181d2b;
  --surface: #232b47;
  --surface-alt: #2d3558;
  --danger: #ff4f6d;
  --white: #fff;
  --black: #000;
  --font-main: 'Orbitron', Arial, sans-serif;
  --font-size-base: 1rem;
  --font-size-lg: 1.2rem;
  --font-size-xl: 2.2rem;
  --font-weight-bold: 800;
  --radius: 18px;
  --radius-lg: 2.5em;
  --padding-base: 1.1rem 2rem;
  --max-width: 1200px;
  --shadow: 0 2px 20px #00ffc85a, 0 0 10px #0002 inset;
  --shadow-lg: 0 8px 48px #00ffc890, 0 2px 18px #181d2b90;
  --transition: 0.18s cubic-bezier(.4, 0, .2, 1);
  --header-height: 90px;
  --header-height-mobile: 65px;
  --z-bg: 0;
  --z-header: 5;
  --z-modal: 1000;
  --z-modal-content: 1001;
  --z-overlay: 4000;
  --z-ui: 50;
  --carousel-side-padding: 5vw;
  --carousel-vertical-padding: 80px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  min-height: 100%;
  margin: 0;
  padding: 0;
  font-family: var(--font-main);
  background: linear-gradient(125deg, #0a172c 0%, #1a2f50 45%, #0f2847 100%);
  color: var(--white);
  font-size: var(--font-size-base);
  letter-spacing: 0.02em;
  width: 100vw;
  overflow-x: auto;
  scroll-behavior: smooth;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: inherit;
}
html, body,
.main-content,
.carousel-wrapper,
.carousel-track {
  overflow: visible !important;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
#bg-animated, #ground-3d, #ground-3d-fade {
  z-index: var(--z-bg) !important;
  position: fixed;
  inset: 0;
  pointer-events: none;
}
header {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 96vw; max-width: var(--max-width);
  background: rgba(24,32,54,0.88);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--padding-base);
  z-index: var(--z-header);
  gap: 1em;
  border: none;
  backdrop-filter: blur(8px);
  font-size: var(--font-size-lg);
  margin-top: 16px;
}
.header-group {
  display: flex;
  align-items: center;
  gap: 0.5em;
}
.coin, .lucid-coin, .highscore {
  font-size: 1em;
  font-weight: var(--font-weight-bold);
  background: rgba(0,0,0,0.10);
  padding: .28em .85em;
  border-radius: 1em;
  display: flex; align-items: center; gap: .4em;
  box-shadow: 0 2px 6px #00ffc84d;
}
.lucid-pieces {
  display: flex; gap: .28em; align-items: center;
}
.lucid-piece {
  width: 22px; height: 22px;
  border-radius: 50%; border: 1.2px solid var(--primary);
  background: #141c1f;
  box-shadow: 0 0 6px #00ffc880;
  opacity: 0.3;
  filter: grayscale(1) brightness(.7);
  transition: filter var(--transition), opacity var(--transition);
  object-fit: contain;
}
.lucid-piece.collected {
  opacity: 1;
  filter: drop-shadow(0 0 10px var(--primary)) brightness(1.18);
}
.lucid-coin-img {
  width: 24px; height: 24px;
  border-radius: 50%; margin-left: .3em;
  background: var(--white); border: 1.2px solid var(--gold);
  box-shadow: 0 0 7px #ffe46f80;
  object-fit: contain;
}
.lucid-coin-info-btn {
  background: none; border: none; color: var(--primary); font-size: 1.1em;
  cursor: pointer; margin-left: .3em;
  transition: color var(--transition);
}
.lucid-coin-info-btn:focus {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.main-content {
  margin-top: 110px;
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100vw;
}
.carousel-wrapper {
  width: 98vw; max-width: var(--max-width); margin: 0 auto;
  display: flex; align-items: center; position: relative;
  min-height: 720px;
  height: auto;
  z-index: var(--z-ui);
  padding-top: 50px;
  overflow: visible !important;
}
.carousel-arrow {
  background: var(--surface);
  color: var(--primary);
  border: none;
  border-radius: 50%;
  width: 48px; height: 48px; font-size: 2em;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background var(--transition);
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: calc(var(--z-ui) + 1);
  opacity: .93;
  box-shadow: 0 2px 12px #00ffc850;
  pointer-events: all;
}
.carousel-arrow.left { left: 0; }
.carousel-arrow.right { right: 0; }
.carousel-arrow:disabled { opacity: .33; pointer-events: none; }
.carousel-track {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: stretch;
  position: relative;
  overflow: visible !important;
  height: auto;
}
.carousel-inner {
  display: flex;
  gap: 2vw;
  width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  padding-left: var(--carousel-side-padding);
  padding-right: var(--carousel-side-padding);
  padding-top: var(--carousel-vertical-padding);
  padding-bottom: var(--carousel-vertical-padding);
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
  align-items: center;
  scroll-snap-type: x mandatory;
  background: none;
  overscroll-behavior-x: contain;
  position: relative;
  height: auto;
  min-height: 0;
  box-sizing: border-box;
}
.carousel-inner::-webkit-scrollbar { display: none; }
.game-card {
  flex: 0 0 320px; max-width: 380px; min-width: 220px;
  height: 440px;
  background: rgba(48,53,65,0.14);
  border-radius: 24px;
  border: none;
  box-shadow: 0 4px 18px #232b47aa;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; cursor: pointer; transition: transform .3s, box-shadow .18s;
  scroll-snap-align: center;
  z-index: var(--z-ui);
  margin: 0;
}
.game-card.selected {
  transform: scale(1.09) translateY(-18px);
  box-shadow: 0 8px 38px #00ffc880, 0 2px 12px #ffe46f88;
  z-index: calc(var(--z-ui) + 3);
}
.game-card.locked {
  filter: grayscale(1) brightness(0.8) contrast(1.05);
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.82;
}
.game-card img {
  width: 98%; max-width: 350px; height: 190px; object-fit: contain;
  margin-bottom: .7em; border-radius: 16px;
  background: rgba(19, 29, 32, 0.8);
  border: none;
  box-shadow: 0 2px 9px #232b4733;
}
.game-title {
  text-align: center; font-size: 1.2em; font-weight: var(--font-weight-bold); color: var(--gold);
  margin-bottom: .3em;
  letter-spacing: 0.04em;
  text-shadow: 0 2px 8px #fff2;
  width: 100%;
}
.game-icon {
  font-size: 2em; margin-bottom: .2em;
  color: var(--primary);
}
.unlock-block {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: rgba(20,30,38,0.97); border-radius: 12px;
  padding: 1em 1.5em;
  text-align: center;
  display: flex; flex-direction: column; gap: .6em; align-items: center;
  z-index: calc(var(--z-ui) + 10);
}
.unlock-block .unlock-price {
  color: var(--gold); font-weight: 700; font-size: 1.12em;
  display: flex; align-items: center; gap: .3em;
}
.unlock-block button {
  background: linear-gradient(90deg, var(--primary) 60%, #1a237e 100%);
  color: #1a237e; border: none; border-radius: 1em;
  font-weight: 700; font-size: 1em; padding: .5em 1.6em;
  cursor: pointer; box-shadow: 0 2px 10px #00ffc890;
  transition: background var(--transition), box-shadow var(--transition);
}
.unlock-block button:disabled {
  background: #aaa; color: #fff; cursor: not-allowed; opacity: .7;
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(18,22,36,0.63);
  display: flex; align-items: center; justify-content: center;
  z-index: var(--z-modal) !important;
  backdrop-filter: blur(6px);
  animation: fadeIn .25s;
}
.modal-content {
  background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow);
  border: 2px solid #00ffc860;
  min-width: 290px; max-width: 98vw;
  padding: 2em 2.2em 1.3em;
  display: flex; flex-direction: column; align-items: center;
  animation: popIn .28s;
  z-index: var(--z-modal-content);
}
.modal-title {
  font-size: 1.2em; font-weight: var(--font-weight-bold); color: var(--primary); margin-bottom: .7em;
  letter-spacing: .04em; text-align: center;
}
.modal-message { font-size: 1.05em; margin-bottom: 1.2em; text-align: center; }
.modal-actions { display: flex; gap: 1.2em; width: 100%; justify-content: center; }
.modal-actions button {
  padding: .6em 1.7em; border-radius: 2em;
  font-weight: 700; font-size: 1.07em;
  background: linear-gradient(90deg, var(--primary), #1a237e 90%);
  color: #1a237e; border: none; cursor: pointer; box-shadow: 0 3px 9px #00ffc8a8;
  transition: background var(--transition);
}
.modal-actions .cancel {
  background: rgba(255,255,255,0.09); color: #fff; box-shadow: none;
  border: 1.5px solid #00ffc850;
}
.preload-overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: var(--deep); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 2em; font-family: var(--font-main);
  transition: opacity .3s;
}
.preload-overlay.hide { opacity: 0; pointer-events: none; transition: opacity .8s; }
.lucid-piece-falling, .lucid-coin-anim-gain {
  position: fixed;
  z-index: calc(var(--z-modal-content) + 10) !important;
  width: 72px;
  height: 72px;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 0 12px #fff8) drop-shadow(0 0 22px var(--primary)) brightness(1.12);
  transition: transform var(--transition);
}
.lucid-coin-anim-gain {
  animation: coin-gain-bounce .9s cubic-bezier(.37,1.6,.58,1.0);
  filter: drop-shadow(0 0 32px var(--gold)) brightness(1.5);
}
@keyframes coin-gain-bounce {
  0% { transform: scale(1.45) translateY(-22px);}
  60% { transform: scale(1.2) translateY(-10px);}
  100% { transform: scale(1) translateY(0);}
}
.play-game-btn {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  z-index: var(--z-ui);
  padding: 1em 2.2em; /* slightly smaller padding */
  font-size: 1.6rem;  /* reduced from 1.8rem */
  font-family: var(--font-main);
  font-weight: var(--font-weight-bold);
  border-radius: 5em;
  background: linear-gradient(92deg, var(--primary) 10%, #1a237e 100%);
  color: var(--deep);
  box-shadow: var(--shadow-lg);
  border: none;
  outline: none;
  display: flex;
  align-items: center;
  gap: 0.7em; /* slightly smaller gap */
  cursor: pointer;
  transition: background var(--transition), box-shadow var(--transition), filter var(--transition), opacity var(--transition);
  opacity: 0.98;
  text-shadow: 0 2px 9px #fff7;
  letter-spacing: 1.2px;
  backdrop-filter: blur(7px);
  animation: popIn 0.33s;
}

.play-game-btn-icon {
  font-size: 1.11em;
  filter: drop-shadow(0 0 10px var(--primary));
  display: flex; align-items: center;
}
.play-game-btn:active, .play-game-btn:focus {
  background: linear-gradient(92deg, var(--primary) 20%, var(--gold) 90%);
  filter: brightness(1.08);
  box-shadow: 0 4px 32px #ffe46f88, 0 1px 14px #00ffc850;
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.play-game-btn[disabled], .play-game-btn.disabled {
  opacity: 0.38;
  cursor: not-allowed;
  filter: grayscale(0.7) brightness(0.8);
  pointer-events: none;
}
@media (max-width: 1200px) {
  .carousel-wrapper { max-width: 100vw; }
}

@media (max-width: 950px) {
  header { font-size: .85em; }
  .main-content { margin-top: var(--header-height); }
  .carousel-wrapper { min-height: 440px; height: auto; }
  .game-card { min-width: 200px; height: 280px; }
  .game-card img { height: 120px; }
  .carousel-inner { padding-top: 10px; padding-bottom: 10px; }
}

@media (max-width: 700px) {
  header { font-size: .78em; padding: .7rem .4rem; }
  .main-content { margin-top: var(--header-height-mobile); }
  .carousel-arrow { width: 34px; height: 34px; font-size: 1.3em; }
  .game-card { min-width: 160px; height: 220px; }
  .game-card img { height: 90px; }
  .modal-content { padding: 1.1em .5em .8em; }
  .play-game-btn { font-size: 1.2em; padding: .7em 1.7em; }
  .carousel-inner { padding-top: 5px; padding-bottom: 5px; }
}

@media (max-width: 480px) {
  header { font-size: .65em; padding: .45rem .15rem; }
  .carousel-wrapper { padding-top: 18px; }
  .main-content { margin-top: 50px; }
  .play-game-btn { font-size: .9em; padding: .5em 1.1em; }
  .carousel-inner { padding-top: 2px; padding-bottom: 2px; }
  .game-card { min-width: 140px; height: 190px; }
  .game-card img { height: 75px; }
}
@keyframes fadeIn {0%{opacity:0}100%{opacity:1}}
@keyframes popIn {0%{transform:scale(.93);opacity:0}100%{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <div class="preload-overlay" id="preloadOverlay">
    <div>Loading assets... <span id="preloadProgress">0%</span></div>
  </div>
  <header>
    <div class="header-group coin"><i class="fas fa-coins"></i><span id="coinCount">0</span></div>
    <div class="header-group lucid-coin">
      <div class="lucid-pieces">
        <img src="/static/lucid_piece1.png" class="lucid-piece" id="piece1" alt="Piece 1">
        <img src="/static/lucid_piece2.png" class="lucid-piece" id="piece2" alt="Piece 2">
        <img src="/static/lucid_piece3.png" class="lucid-piece" id="piece3" alt="Piece 3">
      </div>
      <img src="/static/lucid_coin_total.png" class="lucid-coin-img" id="lucidCoinImg" alt="Lucid Coin">
      <span id="lucidCoinCount">0</span>
      <button class="lucid-coin-info-btn" id="lucidCoinInfoBtn" aria-label="What are Lucid Coins?"><i class="fas fa-circle-info"></i></button>
    </div>
    <div class="header-group highscore" id="highScoreBtn"><i class="fas fa-trophy"></i><span id="highScore">0</span></div>
  </header>
  <main class="main-content">
    <div class="carousel-wrapper">
      <button class="carousel-arrow left" id="arrowLeft" aria-label="Previous Game"><i class="fas fa-chevron-left"></i></button>
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-inner" id="carouselInner"></div>
      </div>
      <button class="carousel-arrow right" id="arrowRight" aria-label="Next Game"><i class="fas fa-chevron-right"></i></button>
    </div>
  </main>
  <button id="playGameBtn" class="play-game-btn" disabled>
    <span class="play-game-btn-icon"><i class="fas fa-play"></i></span>
    <span class="play-game-btn-label">Play Game</span>
  </button>
  <div id="modal" style="display:none"></div>
  <script>
    // ----------- Asset Preload -----------
    const ASSETS = [
      '/static/ground.png',
      '/static/lucid_piece1.png', '/static/lucid_piece2.png', '/static/lucid_piece3.png',
      '/static/lucid_coin_total.png',
      '/static/house1.png', '/static/house2.png', '/static/house3.png', '/static/house4.png', '/static/house5.png'
    ];
    let loadedAssets = 0;
    function updatePreload() {
      const pct = Math.round((loadedAssets / ASSETS.length) * 100);
      document.getElementById('preloadProgress').textContent = pct + '%';
    }
    function preloadAssets(done) {
      let finished = 0;
      ASSETS.forEach(src => {
        const img = new Image();
        img.onload = img.onerror = function() {
          loadedAssets++; updatePreload();
          if (++finished === ASSETS.length) setTimeout(done, 300);
        };
        img.src = src;
      });
    }
    preloadAssets(() => {
      document.getElementById('preloadOverlay').classList.add('hide');
      setTimeout(() => document.getElementById('preloadOverlay').style.display = 'none', 1000);
      window.startApp();
    });
    function showModal({title, message, actions}) {
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="modal-backdrop" tabindex="0">
          <div class="modal-content" role="dialog" aria-modal="true">
            <div class="modal-title">${title}</div>
            <div class="modal-message">${message}</div>
            <div class="modal-actions">
              ${actions.map((a,i) =>
                `<button class="${a.className||""}" data-modal-btn="${i}">${a.label}</button>`
              ).join('')}
            </div>
          </div>
        </div>`;
      modal.style.display = "block";
      modal.querySelector(".modal-backdrop").onclick = e => {
        if (e.target === e.currentTarget) { modal.style.display="none"; }
      };
      window.onkeydown = e => { if (e.key === "Escape") modal.style.display = "none"; }
      actions.forEach((a,i) => {
        modal.querySelector(`[data-modal-btn="${i}"]`).onclick = () => {
          modal.style.display = "none";
          if (a.callback) a.callback();
        };
      });
    }
    window.startApp = function() {
      const games = [
        { img: '/static/house1.png', title: "LucidMath", icon: '<i class="fas fa-dice-d20"></i>', link: 'lucidgame', price: 0 },
        { img: '/static/house2.png', title: "LucidTypist", icon: '<i class="fas fa-cube"></i>', link: 'lucidtypist', price: 300 },
        { img: '/static/house3.png', title: "GemRunner", icon: '<i class="fas fa-gem"></i>', link: '', price: 900 },
        { img: '/static/house4.png', title: "SkyStack", icon: '<i class="fas fa-layer-group"></i>', link: '', price: 2000 },
        { img: '/static/house5.png', title: "MindTwist", icon: '<i class="fas fa-brain"></i>', link: '', price: 3500 }
      ];
let unlocked = JSON.parse(localStorage.getItem('lucidUnlockedGames') || '[true,false,false,false,false]');
unlocked[0] = true;

let coins = +localStorage.getItem('totalCoins') || 500;
let highScore = +localStorage.getItem('highScore') || 0;
let lucidCoin = +localStorage.getItem('lucidCoins') || 0;
let pieces = JSON.parse(localStorage.getItem('lucidPieces') || '[false,false,false]');

let selectedIdx = 0;

const $coin = document.getElementById('coinCount');
const $highScore = document.getElementById('highScore');
const $lucidCoin = document.getElementById('lucidCoinCount');
const $pieceImgs = [1, 2, 3].map(i => document.getElementById('piece' + i));

const $carouselTrack = document.getElementById('carouselTrack');
const $carouselInner = document.getElementById('carouselInner');
const $arrowL = document.getElementById('arrowLeft');
const $arrowR = document.getElementById('arrowRight');
const $playBtn = document.getElementById('playGameBtn');

      function getSidePaddingPx() {
        const style = getComputedStyle($carouselInner);
        let left = style.paddingLeft;
        if (left.endsWith('vw')) {
          return window.innerWidth * (parseFloat(left) / 100);
        }
        return parseFloat(left);
      }

      function updateHeader() {
        $coin.textContent = coins;
        $highScore.textContent = highScore;
        $lucidCoin.textContent = lucidCoin;
        $pieceImgs.forEach((img,i)=>{
          img.classList.toggle('collected', !!pieces[i]);
        });
      }
      function renderCarousel() {
        $carouselInner.innerHTML = '';
        games.forEach((g,i) => {
          const card = document.createElement('div');
          card.className = 'game-card' + (i===selectedIdx?' selected':'') + (unlocked[i]?'':' locked');
          card.tabIndex = 0;
          card.setAttribute('data-idx',i);
          card.innerHTML = `
            <div class="game-icon">${g.icon}</div>
            <img src="${g.img}" alt="${g.title}">
            <div class="game-title">${g.title}</div>
          `;
          if (!unlocked[i]) {
            card.innerHTML += `
              <div class="unlock-block">
                <div class="unlock-price"><i class="fas fa-coins"></i> ${g.price}</div>
                <button ${coins<g.price?'disabled':''}>Unlock</button>
              </div>`;
            card.querySelector('button').onclick = e => {
              e.stopPropagation();
              unlockGame(i);
            }
          }
          card.onclick = () => {
            if (selectedIdx !== i) {
              selectedIdx = i;
              afterSelectOrRender();
            }
          };
          $carouselInner.appendChild(card);
        });
        updateHeader();
        updateArrows();
        setTimeout(()=>centerSelected(),50);
      }
      function centerSelected(smooth=true) {
        const cards = Array.from($carouselInner.children);
        if (!cards[selectedIdx]) return;
        const card = cards[selectedIdx];
        const container = $carouselInner;
        const sidePadding = getSidePaddingPx();
        const cardRect = card.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        const currScroll = container.scrollLeft;
        const cardCenter = card.offsetLeft + card.offsetWidth / 2;
        const visibleWidth = container.clientWidth;
        let scroll = cardCenter - visibleWidth / 2;
        const maxScroll = container.scrollWidth - visibleWidth;
        scroll = Math.max(0, Math.min(scroll, maxScroll));
        container.scrollTo({left: scroll, behavior: smooth?"smooth":"auto"});
      }
      function updateArrows() {
        $arrowL.disabled = (selectedIdx<=0);
        $arrowR.disabled = (selectedIdx>=games.length-1);
      }
      $arrowL.onclick = ()=>{ if(selectedIdx>0){selectedIdx--;afterSelectOrRender();}};
      $arrowR.onclick = ()=>{ if(selectedIdx<games.length-1){selectedIdx++;afterSelectOrRender();}};
      window.addEventListener('resize',()=>centerSelected(false));
      $carouselInner.addEventListener('wheel',e=>{
        if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
          $carouselInner.scrollLeft += e.deltaY * .85; e.preventDefault();
        }
      },{passive:false});
      document.body.addEventListener('keydown',e=>{
        if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
        if(e.key==="ArrowRight" && selectedIdx<games.length-1){selectedIdx++;afterSelectOrRender();}
        if(e.key==="ArrowLeft" && selectedIdx>0){selectedIdx--;afterSelectOrRender();}
      });
      function unlockGame(idx) {
        if(coins<games[idx].price) {
          return showModal({
            title:"Not Enough Coins",
            message:`You need <b>${games[idx].price}</b> coins to unlock this game.<br>Your coins: <b>${coins}</b>`,
            actions:[{label:"OK",className:"cancel"}]
          });
        }
        showModal({
          title:"Unlock Game?",
          message:`Do you want to unlock <b>${games[idx].title}</b> for <b>${games[idx].price} coins</b>?`,
          actions:[
            {label:"Cancel",className:"cancel"},
            {label:"Unlock",callback:()=>{
              coins -= games[idx].price;
              unlocked[idx]=true;
              localStorage.setItem('lucidUnlockedGames', JSON.stringify(unlocked));
              localStorage.setItem('totalCoins', coins);
              afterSelectOrRender();
              showModal({
                title:"Game Unlocked!",
                message:`Enjoy your new game!`,
                actions:[{label:"OK",className:"cancel"}]
              });
            }}
          ]
        });
      }
      function updatePlayButton() {
        const game = games[selectedIdx];
        if (unlocked[selectedIdx] && game.link) {
          $playBtn.disabled = false;
          $playBtn.classList.remove('disabled');
          $playBtn.title = "Play this game";
        } else {
          $playBtn.disabled = true;
          $playBtn.classList.add('disabled');
          $playBtn.title = unlocked[selectedIdx] ? "This game will be available soon" : "Unlock the game first";
        }
        $playBtn.querySelector('.play-game-btn-label').textContent = "Play Game";
      }
      $playBtn.onclick = () => {
        const game = games[selectedIdx];
        if (unlocked[selectedIdx] && game.link) {
          window.location = game.link;
        }
      };
      function afterSelectOrRender() {
        renderCarousel();
        updatePlayButton();
      }
      document.getElementById('lucidCoinInfoBtn').onclick = ()=>{
        showModal({
          title:"What are Lucid Coins?",
          message:`
            <b>What are Lucid Coins?</b><br>
            <span style="color:#00ffc8">Lucid Coins🪙</span> are rare coins you collect by finding 3 unique Lucid Pieces.<br>
            <ul style="text-align:left;">
              <li><b>Collect all 3 unique Lucid Pieces to earn 1 Lucid Coin!</b></li>
              <li><b>Use Lucid Coins to continue your game after Game Over:</b><br>
                1st continue: 1 coin, 2nd: 2 coins, 3rd: 3 coins, then no more continues.</li>
            </ul>
            <span style="color:#ffe46f;">Collect more Lucid Coins for more continues!</span>
          `,
          actions:[{label:"Close",className:"cancel"}]
        });
      };
      document.getElementById('highScoreBtn').onclick = ()=>{
        let board = '<div style="width:100%;max-width:340px;margin:auto">';
        games.forEach((g,i)=>{
          let score = +localStorage.getItem('lucid_highscore_'+i)||0;
          board += `
            <div style="display:flex;align-items:center;gap:.7em;background:#151d2b;padding:.7em 1em;margin-bottom:.4em;border-radius:12px;">
              <span style="font-size:2em">${g.icon}</span>
              <span style="flex:1;font-weight:700;color:var(--gold);">${g.title}</span>
              <span style="font-size:1.2em;font-weight:800;background:linear-gradient(90deg,var(--gold) 30%,#fff 100%);
                -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 2px 8px #00ffc8b0;">${score}</span>
            </div>`;
        });
        board += '</div>';
        showModal({
          title:"Your Game Awards",
          message:board,
          actions:[{label:"Close",className:"cancel"}]
        });
      };
      afterSelectOrRender();
      updateHeader();
      setTimeout(centerSelected,500);
    };
  </script>
</body>
</html>
