<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - IFTA Report Generator</title>

  <!-- SEO + Meta -->
  <meta name="description" content="IFTA Dashboard for generating reports, managing ELD tools, and more." />
  <meta name="theme-color" content="#1f6f8b" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.269.0"></script>

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='IFTA5458.png') }}" type="image/png" />
  <noscript><link rel="icon" href="/static/IFTA5458.png" type="image/png" /></noscript>

  <!-- Styles -->
  <style>
    :root {
      --primary: #1f6f8b;
      --primary-dark: #14506d;
      --background: #1f1f1f;
      --card-bg: #292929;
      --text: #ecf0f1;
      --accent: #30cfcf;
      --danger: #b84e4e;
      --danger-dark: #a13f3f;
      --radius: 20px;
      --transition: 0.3s ease;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 3s infinite;
      user-select: none;
    }

    @keyframes pulseText {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }

    .dashboard-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
      margin-top: 3rem;
    }

    .dashboard-btn {
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: none;
      padding: 1.4rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: var(--transition);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      user-select: none;
      min-width: 240px;
      height: 80px;
    }

    .dashboard-btn svg {
      stroke-width: 1.8;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      stroke: white;
      transition: stroke var(--transition);
    }

    .dashboard-btn:hover,
    .dashboard-btn:focus-visible {
      transform: translateY(-4px) scale(1.03);
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .dashboard-btn:hover svg,
    .dashboard-btn:focus-visible svg {
      stroke: var(--accent);
    }

    .dashboard-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.05);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .dashboard-btn:hover::after,
    .dashboard-btn:focus-visible::after {
      opacity: 1;
    }

    #logoutBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: var(--danger);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 999;
      transition: background-color var(--transition);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
    }

    #logoutBtn svg {
      stroke-width: 1.8;
      width: 20px;
      height: 20px;
      stroke: white;
    }

    #logoutBtn:hover,
    #logoutBtn:focus-visible {
      background-color: var(--danger-dark);
      outline: none;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1001;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.3s ease forwards;
      user-select: none;
    }

    .modal-content[tabindex="-1"]:focus {
      outline: none;
    }

    .modal h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .modal p {
      font-size: 1rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .modal-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .modal-btn {
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      background-color: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      min-width: 110px;
    }

    .modal-btn:hover,
    .modal-btn:focus-visible {
      background-color: var(--primary-dark);
      outline: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .dashboard-buttons {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 2rem;
      }
      #logoutBtn {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
      .dashboard-btn {
        font-size: 0.95rem;
        padding: 1rem 1.2rem;
        gap: 0.6rem;
      }
      .dashboard-btn svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome, {{ username|e }}!</h1>
  </header>

  <nav class="dashboard-buttons" role="navigation" aria-label="Dashboard navigation">

  <a href="{{ url_for('generate_report') }}" class="dashboard-btn" aria-label="Generate IFTA Report">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l7 7v9a2 2 0 0 1-2 2z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h6"/>
    </svg>
    Generate IFTA Report
  </a>

  <!-- Malfunction icon replaced with wrench (repair) -->
  <a href="{{ url_for('eld_malfunction_letter') }}" class="dashboard-btn" aria-label="ELD Malfunction Letter">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path d="M14.7 5.3a4 4 0 0 0-5.4 5.4l-4 4a1.5 1.5 0 0 0 2.1 2.1l4-4a4 4 0 0 0 5.4-5.4z" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 12l4 4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ELD Malfunction Letter
  </a>

  <!-- Tutorial Viewer icon replaced with a book -->
  <a href="{{ url_for('tutorial') }}" class="dashboard-btn" aria-label="Tutorial Viewer">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.5 2H20a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 0 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Tutorial Viewer
  </a>

  <!-- Time Zones replaced with US map icon -->
  <a href="{{ url_for('timezones') }}" class="dashboard-btn" aria-label="Time Zones">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h1l1 2 1-1 1 1v3l-1 2v2l2 1 2-2 1-1 3 1 1-1 2-1v-3l-2-3h-3l-2-1-3 1-1-1-1 1-1-1z"/>
    </svg>
    Time Zones
  </a>

  <a href="{{ url_for('mail_page') }}" class="dashboard-btn" aria-label="Send Email">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path d="M4 4h16v16H4z" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 4l8 8 8-8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Send Email
  </a>

  <a href="{{ url_for('eldquiz') }}" class="dashboard-btn" aria-label="ELD Quiz">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
      <path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ELD Quiz
  </a>

    <a href="{{ url_for('gamehome') }}" class="dashboard-btn" aria-label="GameLucid">
      <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
        <path d="M4 8c0-2.2 2-4 4.5-4h7c2.5 0 4.5 1.8 4.5 4v6c0 2.2-2 4-4.5 4h-7C6 18 4 16.2 4 14V8z"/>
        <line x1="8" y1="11" x2="10" y2="11" />
        <line x1="9" y1="10" x2="9" y2="12" />
        <circle cx="16" cy="11" r="1.5" />
        <path d="M12 3l.4 1.2L14 5l-1.2.4L12 7l-.4-1.6L10 5l1.6-.4L12 3z"/>
      </svg>
      GameLucid
    </a>

    <a href="{{ url_for('supportresources') }}" class="dashboard-btn" aria-label="Support Resources">
      <svg xmlns="http://www.w3.org/2000/svg" class="lucide" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      Support Resources
    </a>
  </nav>


  <button id="logoutBtn" aria-haspopup="dialog" aria-controls="logoutModal" aria-expanded="false" aria-label="Logout">
    <svg xmlns="http://www.w3.org/2000/svg" class="lucide" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 16v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h.1a2 2 0 0 1 2 2v1"/>
    </svg>
    Logout
  </button>

  <div id="logoutModal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="logoutModalTitle" aria-describedby="logoutModalDesc" tabindex="-1">
    <div class="modal-content" role="document" tabindex="-1">
      <h2 id="logoutModalTitle">Confirm Logout</h2>
      <p id="logoutModalDesc">Are you sure you want to log out?</p>
      <div class="modal-buttons">
        <button id="confirmLogoutBtn" class="modal-btn" type="button">Yes, Logout</button>
        <button id="cancelLogoutBtn" class="modal-btn" type="button" style="background-color: var(--danger);">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutModal = document.getElementById('logoutModal');
    const confirmLogoutBtn = document.getElementById('confirmLogoutBtn');
    const cancelLogoutBtn = document.getElementById('cancelLogoutBtn');
    let lastFocusedElement;

    function openModal() {
      lastFocusedElement = document.activeElement;
      logoutModal.classList.add('active');
      logoutBtn.setAttribute('aria-expanded', 'true');
      logoutModal.querySelector('[tabindex="-1"]').focus();
    }

    function closeModal() {
      logoutModal.classList.remove('active');
      logoutBtn.setAttribute('aria-expanded', 'false');
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    logoutBtn.addEventListener('click', openModal);
    cancelLogoutBtn.addEventListener('click', closeModal);

    confirmLogoutBtn.addEventListener('click', () => {
      window.location.href = "{{ url_for('logout') }}";
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && logoutModal.classList.contains('active')) closeModal();
    });

    // Trap focus within modal
    function trapFocus(el) {
      const focusable = el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      el.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        if (e.shiftKey && document.activeElement === first) {
          last.focus();
          e.preventDefault();
        } else if (!e.shiftKey && document.activeElement === last) {
          first.focus();
          e.preventDefault();
        }
      });
    }

    trapFocus(logoutModal);
  </script>
</body>
</html>
