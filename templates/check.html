<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GameLucid Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Preload Audio & BG -->
  <link rel="preload" href="/static/audio/coin.wav" as="audio" type="audio/wav">
  <link rel="preload" href="/static/audio/wrong.wav" as="audio" type="audio/wav">
  <link rel="preload" href="/static/audio/menu-loop.mp3" as="audio" type="audio/mp3">
  <link rel="preload" as="image" href="/static/backgrounds/bghome.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg1.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg2.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg3.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg4.png">
  <link rel="preload" as="image" href="/static/backgrounds/bg5.png">
  <style>
/* Reset */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Global */
body {
  font-family: 'Space Grotesk', 'Orbitron', sans-serif;
  background: linear-gradient(160deg, #000428, #004e92);
  color: #e0f7fa;
  overflow: hidden;
  height: 100vh;
  letter-spacing: 0.6px;
  line-height: 1.6;
}

/* Firefly Background */
#firefly-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.firefly {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  width: 2px;
  height: 2px;
  opacity: 0.5;
  animation: twinkle 3.5s infinite ease-in-out alternate, moveXY 20s linear infinite;
  filter: drop-shadow(0 0 4px #0ff);
}

@keyframes twinkle {
  from { opacity: 0.3; transform: scale(1); }
  to { opacity: 1; transform: scale(1.2); }
}

@keyframes moveXY {
  0% { transform: translate(0, 0); }
  100% { transform: translate(100vw, 100vh); }
}

/* Home Screen */
#home-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2000;
  padding: 2rem;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

  /* ⬇️ Background Image Setup */
  background-image: url('./static/backgrounds/bghome.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* Optional dark overlay */
  background-color: rgba(0, 0, 0, 0.6);
  background-blend-mode: overlay;
}

.home-content {
  max-width: 700px;
  width: 100%;
  background: rgba(0, 0, 0, 0.4);
  padding: 2.5rem;
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.08);
  animation: fadeInUp 1.4s cubic-bezier(0.25, 1, 0.5, 1);
  color: #f0f0f0;
}
#home-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: inherit;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transform: scale(1.1);
  opacity: 1;
  animation: kenBurns 30s ease-in-out infinite alternate;
}

@keyframes kenBurns {
  0% { transform: scale(1.1); }
  100% { transform: scale(1.15); }
}

#stars-canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 2001;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  opacity: 0.3;
}

#blue-stars-canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1; /* Adjust depending on layers */
  pointer-events: none;
  width: 100vw;
  height: 100vh;
}

/* Darker Task Section */
.home-content h2 {
  font-size: 2.2rem;
  color: #ffffff;
  background: rgba(0, 0, 0, 0.6); /* Darkened backdrop */
  padding: 0.8rem 1.2rem;
  border-radius: 12px;
  display: inline-block;
  margin-bottom: 1.5rem;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
}

/* PRO-LEVEL Start Button */
#start-btn {
  margin-top: 2rem;
  padding: 1rem 2.6rem;
  font-size: 1.5rem;
  font-weight: 600;
  font-family: 'Segoe UI', 'Roboto', sans-serif;
  color: #f4fefc;
  background: linear-gradient(135deg, #0f3d2e, #1e7e4e, #3ed39b);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow:
    0 4px 10px rgba(0, 64, 32, 0.3),
    inset 0 0 0 1px rgba(255, 255, 255, 0.03),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(4px);
  will-change: transform, box-shadow;
}

/* Subtle Shimmer Line */
#start-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -70%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-25deg);
  animation: shimmerLine 2.6s ease-in-out infinite;
}

@keyframes shimmerLine {
  0% { left: -70%; }
  100% { left: 130%; }
}

/* Hover Interaction */
#start-btn:hover {
  transform: scale(1.02);
  box-shadow:
    0 6px 14px rgba(30, 150, 100, 0.3),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
}

#start-btn:active {
  transform: scale(0.98);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
}

/* Optional Active Click */
#start-btn:active {
  transform: scale(0.99);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) inset;
}


/* Score Panel with Enhanced Glass Effect */
#score-panel {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row !important;
  align-items: center;
  gap: 0.75rem; /* увеличено с 0.6rem */
  z-index: 9999;
  padding: 0.4rem 0.9rem; /* увеличено */
  background: rgba(255,255,255,0.08);
  border-radius: 10px; /* немного больше */
  box-shadow: 0 3px 8px rgba(0,0,0,0.12); /* чуть выразительнее */
  backdrop-filter: blur(4px);
  font-size: 1.05rem; /* увеличено с 0.98rem */
  min-height: 40px; /* увеличено с 36px */
}

#score-panel > div,
#lucid-panel {
  display: flex;
  align-items: center;
  gap: 0.5rem; /* увеличено с 0.4rem */
  background: rgba(255,255,255,0.09);
  padding: 0.25rem 0.6rem; /* увеличено */
  border-radius: 8px;
  font-size: 1.05rem;
  margin: 0 !important;
  min-width: 0;
}

#score-panel i {
  color: #00ffff;
}
/* Game Container */
#game-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -40%);
  opacity: 1;
  width: 92vw;
  max-width: 740px;
  padding: 3rem 2.4rem;

  z-index: 100;
  border-radius: 24px;

  background: rgba(20, 24, 28, 0.65);
  backdrop-filter: blur(20px) saturate(200%);
  -webkit-backdrop-filter: blur(20px) saturate(200%);

  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.05),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04);

  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.4s ease;
}

/* Equation Box Title with Neon Gradient */
#equation-box h1 {
  font-size: clamp(2.8rem, 6vw, 4rem);
  font-weight: 800;
  text-align: center;
  margin: 2rem 0;

  background: linear-gradient(90deg, #e0f7fa, #ffffff, #d1f2eb);
  background-size: 300%;
  background-position: center;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.3),
    0 0 12px rgba(0, 255, 255, 0.2),
    0 0 22px rgba(0, 200, 180, 0.25);

  animation: gradientFlow 12s linear infinite;
}

@keyframes textGlowMaster {
  0%, 100% {
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.4),
      0 0 10px rgba(0, 255, 255, 0.1),
      0 0 18px rgba(0, 255, 204, 0.2);
  }
  50% {
    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.5),
      0 0 14px rgba(0, 255, 255, 0.25),
      0 0 26px rgba(0, 255, 204, 0.4);
  }
}

@keyframes gradientFlow {
  0% {
    background-position: 0% center;
  }
  100% {
    background-position: 200% center;
  }
}

/* Answers Buttons with Hover Effect */
#answers {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
}

#answers button {
  flex: 1 1 45%;
  padding: 1.1rem 1.5rem;
  font-size: 1.4rem;
  font-weight: 600;
  color: #fefefe;
  background: linear-gradient(135deg, #00796b, #00cba9);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  overflow: hidden;

  box-shadow:
    0 6px 16px rgba(0, 255, 170, 0.2),
    inset 0 1px 1px rgba(255, 255, 255, 0.1);
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

#answers button:hover {
  transform: translateY(-2px) scale(1.05);
  background: linear-gradient(135deg, #00bfa5, #1de9b6);
  box-shadow: 0 12px 24px rgba(0, 255, 170, 0.4);
}

#answers button::after {
  content: '';
  position: absolute;
  width: 160%;
  height: 100%;
  top: 0;
  left: -80%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.12), transparent);
  transform: skewX(-25deg);
  transition: all 0.4s ease;
  opacity: 0;
}

#answers button:hover::after {
  left: 100%;
  opacity: 1;
} 

/* Pro-Level Timer Bar */
#timer-bar {
  height: 24px;
  margin-top: 2.5rem;
  background: linear-gradient(to right, #1e1e1e, #2a2a2a);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
  box-shadow:
    inset 0 1px 3px rgba(255, 255, 255, 0.05),
    inset 0 -1px 4px rgba(0, 0, 0, 0.2),
    0 2px 6px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(6px);
}

/* Progress Fill */
#timer-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #8e0000, #c43e00, #dcdcdc);
  background-size: 200% auto;
  animation: timerPulse 4s ease-in-out infinite;
  transition: width 0.3s ease;
  border-radius: 14px;
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.05);
}

/* Subtle, Elegant Animation */
@keyframes timerPulse {
  0% {
    background-position: 0% 0%;
  }
  50% {
    background-position: 100% 0%;
  }
  100% {
    background-position: 0% 0%;
  }
}


/* Level Up Banner */
#level-up-banner {
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 1.2rem 2.5rem;
  font-size: 2rem;
  font-weight: 600;
  color: #e6fdfc;
  background: linear-gradient(135deg, rgba(0, 64, 64, 0.5), rgba(0, 128, 128, 0.2));
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  box-shadow:
    0 8px 32px rgba(0, 255, 255, 0.1),
    inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(12px);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
  animation: levelUpReveal 1.6s ease forwards;
  z-index: 10000;
  will-change: opacity, transform;
}

@keyframes levelUpReveal {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(-10px) scale(0.9);
  }
  40% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1.05);
  }
  70% {
    transform: translateX(-50%) scale(1.02);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) translateY(10px) scale(1);
  }
}

/* Professional Coin Animation */
.coin-animation {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 9999;
  opacity: 0;

  background: radial-gradient(circle at 35% 35%, #f8e58c 0%, #d4a232 60%, #7a5d1c 100%);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.3),
    inset -1px -1px 2px rgba(0, 0, 0, 0.2),
    0 2px 8px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(1px);
  animation: coinBurst 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;

  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
  will-change: transform, opacity;
}


@keyframes coinBurst {
  0% {
    transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
    opacity: 1;
    filter: blur(0);
  }
  25% {
    transform: translate(-50%, -52%) scale(1.2) rotate(120deg);
    filter: blur(0.5px);
  }
  60% {
    transform: translate(calc(-50% + 140px * (0.5 - var(--x))), calc(-50% + 140px * var(--x))) scale(1.05) rotate(240deg);
    filter: blur(0.2px);
  }
  100% {
    transform: translate(calc(-50% + 220px * (0.5 - var(--x))), calc(-50% + 220px * var(--x))) scale(0.75) rotate(360deg);
    opacity: 0;
    filter: blur(1.2px);
  }
}

/* End Screen (Glassmorphic Overlay) */
#end-screen {
  position: fixed;
  inset: 0;
  display: nonw;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: rgba(12,18,32,0.93);
  z-index: 10000;
  font-family: 'Orbitron','Space Grotesk',sans-serif;
  animation: fadeInEnd 0.7s;
}

#score-panel {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.8rem;
  z-index: 10001;
  padding: 0.38rem 1.1rem;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,255,255,0.10);
  font-size: 1.04rem;
}

#score-panel > div, #lucid-panel {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(255,255,255,0.10);
  padding: 0.18rem 0.6rem;
  border-radius: 8px;
  font-size: 1.04rem;
}
#lucid-panel .lucid-coin-img { width: 18px; height: 18px; margin-right: 0.09rem;}
#lucid-panel .lucid-piece-slot { width: 12px; height: 12px; margin: 0 1px;}

.over-modal {
  margin: 105px auto 0 auto;
  background: linear-gradient(135deg,rgba(0,32,64,0.88),rgba(0,64,96,0.94));
  border-radius: 28px;
  box-shadow: 0 10px 40px #00ffc81a, 0 0 0 2px #00ffc833 inset;
  padding: 2.2rem 2.6rem 2.1rem 2.6rem;
  max-width: 95vw;
  min-width: 320px;
  text-align: center;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeInEnd 0.85s;
}

.scores-block {
  margin-bottom: 1.9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.38rem;
}
.score-title {
  color: #b6fff6;
  font-weight: 700;
  font-size: 1.13rem;
  letter-spacing: 0.06em;
  margin-bottom: 0.15em;
  text-shadow: 0 1px 10px #00ffc844;
}
.score-title.high-score { margin-top: 0.7em; color: #ffeb3b; }
.score-value {
  font-size: 2.45rem;
  font-weight: 900;
  color: #00ffc8;
  letter-spacing: 0.1em;
  text-shadow: 0 2px 22px #00ffc880, 0 0 8px #fff8;
  margin-bottom: 0.12em;
}

.pro-buy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.65em;
  margin: 0.4em auto 2.3em auto;
  padding: 0.75em 1.8em 0.75em 1.5em;
  background: linear-gradient(135deg, #1bffb7 0%, #00c7ff 100%);
  border: none;
  border-radius: 2.2em;
  box-shadow: 0 2px 28px #10ffd160, 0 0 0 2px #fff4 inset;
  font-size: 1.18rem;
  font-weight: 700;
  color: #003a36;
  cursor: pointer;
  position: relative;
  transition: transform 0.14s, box-shadow 0.14s, background 0.16s;
  outline: none;
  overflow: visible;
}

.pro-buy-btn:hover, .pro-buy-btn:focus {
  background: linear-gradient(135deg, #00c7ff 0%, #1bffb7 100%);
  transform: scale(1.09);
  box-shadow: 0 5px 32px #00ffc860, 0 0 0 3px #0ff7 inset;
}
.lucid-coin-anim {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  background: radial-gradient(circle,#fff9 35%,#00ffc8 100%);
  border-radius: 50%;
  margin-right: 0.13em;
  box-shadow: 0 0 12px #00ffc8aa;
  animation: coinPulseOver 1.7s infinite;
}
.lucid-coin-anim img {
  width: 21px;
  height: 21px;
  animation: coinSpin 1.5s linear infinite;
}

@keyframes coinPulseOver {
  0%,100% { box-shadow: 0 0 12px #00ffc8aa;}
  40% { box-shadow: 0 0 23px #fff4;}
}

@keyframes coinSpin {
  0% { transform: rotateY(0);}
  100% { transform: rotateY(360deg);}
}

.plus-heart {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.plus-heart i.fa-heartbeat {
  font-size: 1.42em;
  color: #ff3b6a;
  text-shadow: 0 0 7px #ff3b6a66, 0 0 14px #fff9;
  animation: heartBeat 1.5s infinite;
}
.plus-heart i.fa-plus {
  font-size: 0.93em;
  color: #00ffc8;
  position: absolute;
  right: -0.56em;
  top: 0.2em;
  text-shadow: 0 0 8px #00ffc855;
  animation: plusJump 1.5s infinite;
}
@keyframes heartBeat {
  0%,100% { transform: scale(1);}
  25% { transform: scale(1.11);}
  50% { transform: scale(1.20);}
  75% { transform: scale(1.07);}
}
@keyframes plusJump {
  0%,100% { transform: translateY(0);}
  60% { transform: translateY(-5px) scale(1.14);}
}

.buy-text {
  font-size: 1.03em;
  font-weight: 700;
  color: #003a36;
  margin-left: 0.2em;
  letter-spacing: 0.05em;
  text-shadow: 0 1px 8px #fff6;
}

.over-actions {
  display: flex;
  flex-direction: row;
  gap: 1.3rem;
  justify-content: center;
  margin-top: 1.7rem;
}
.over-btn {
  padding: 1rem 2.6rem;
  font-size: 1.17rem;
  border-radius: 13px;
  border: none;
  background: linear-gradient(90deg, #00ffc8, #0ff 70%);
  color: #003a36;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 16px rgba(0,255,255,0.18);
  letter-spacing: 0.04em;
  transition: background 0.17s, transform 0.13s;
  margin: 0 !important;
  display: flex;
  align-items: center;
  gap: 0.7em;
}
.over-btn:hover {
  background: linear-gradient(90deg, #0ff 10%, #00ffc8 90%);
  color: #101e29;
  transform: scale(1.09);
}

@media (max-width: 600px) {
  #score-panel { font-size: 0.90rem; padding: 0.16rem 0.5rem;}
  .over-modal { padding: 1.2rem 1rem; min-width: unset; }
  .score-title, .buy-text, .over-btn { font-size: 1rem;}
  .score-value { font-size: 1.5rem;}
  .pro-buy-btn { font-size: 1rem; padding: 0.6em 1.2em;}
}
@keyframes fadeInEnd {
  0% { opacity: 0; transform: scale(0.96);}
  100% { opacity: 1; transform: scale(1);}
}

/* Countdown Circle */
#countdown-circle {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 3.2rem;
  font-weight: 800;
  color: #e0ffff;
  text-shadow:
    0 0 6px rgba(0, 255, 255, 0.4),
    0 0 12px rgba(0, 255, 255, 0.6);

  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 8px 20px rgba(0, 255, 255, 0.1),
    inset 0 0 10px rgba(255, 255, 255, 0.08);

  animation: countdownPulse 1.8s ease-in-out infinite;
  z-index: 10000;
}


@keyframes countdownPulse {
  0%, 100% {
    transform: translate(-50%, -50%) scale(1);
    box-shadow:
      0 8px 20px rgba(0, 255, 255, 0.1),

  75%  { transform: translateX(-3px); }
  90%  { transform: translateX(3px); }

.lucid-piece {

function preloadAssets(assetList, onProgress, onComplete) {
  let loaded = 0, total = assetList.length;
  if (total === 0) { onProgress(100); onComplete(); return; }
  const update = () => {
    let percent = Math.floor((loaded / total) * 100);
    onProgress(percent);
    if (loaded >= total) setTimeout(onComplete, 400);
  };
  assetList.forEach(src => {
    let ext = src.split('.').pop().toLowerCase();
    let el;
    if (['png','jpg','jpeg','gif','webp'].includes(ext)) {
      el = new window.Image();
      el.onload = el.onerror = () => { loaded++; update(); };
      el.src = src;
    } else if (['mp3','wav','ogg'].includes(ext)) {
      el = new window.Audio();
      el.oncanplaythrough = el.onerror = () => { loaded++; update(); };
      el.preload = "auto";
      el.src = src;
    } else {
      loaded++; update();
    }
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingText = document.getElementById('loading-text');
  const spinnerFill = document.getElementById('loading-spinner-fill');
  preloadAssets(GAME_ASSETS,
    percent => {
      loadingText.textContent = `${percent}%`;
      // Animate spinner: 0% = 0deg, 100% = 360deg
      spinnerFill.style.transform = `rotate(${(percent/100)*360 - 90}deg)`;
    },
    () => {
      loadingOverlay.classList.add('fade-out');
      setTimeout(() => loadingOverlay.remove(), 1000);
      // Now start your game!
      new GameLucidPro();
    }
  );
});
// Stars (звёзды)
(function(){
  const starsCanvas = document.getElementById('stars-canvas');
  if (!starsCanvas) return;
  const starsCtx = starsCanvas.getContext('2d');
  function resizeStarsCanvas() {
    starsCanvas.width = window.innerWidth;
    starsCanvas.height = window.innerHeight;
  }
  resizeStarsCanvas();
  window.addEventListener('resize', resizeStarsCanvas);

  const stars = [];
  const starCount = 160;
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * starsCanvas.width,
      y: Math.random() * starsCanvas.height,
      size: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.6 + 0.4,
      alphaChange: (Math.random() * 0.02) + 0.008,
      angle: Math.random() * Math.PI * 2,
      rotationSpeed: (Math.random() - 0.5) * 0.01,
      dx: (Math.random() - 0.5) * 0.15,
      dy: (Math.random() - 0.5) * 0.15
    });
  }
  function drawStar(star) {
    starsCtx.save();
    starsCtx.translate(star.x, star.y);
    starsCtx.rotate(star.angle);
    const baseAlpha = star.alpha;
    const glowColor = `rgba(255, 255, 150, ${baseAlpha})`;
    const sharpColor = `rgba(255, 255, 80, ${baseAlpha})`;
    starsCtx.globalAlpha = baseAlpha;
    starsCtx.fillStyle = sharpColor;
    starsCtx.beginPath();
    starsCtx.arc(0, 0, star.size, 0, Math.PI * 2);
    starsCtx.fill();
    starsCtx.strokeStyle = glowColor;
    starsCtx.lineWidth = 0.6;
    starsCtx.beginPath();
    starsCtx.moveTo(-star.size * 2.5, 0);
    starsCtx.lineTo(star.size * 2.5, 0);
    starsCtx.stroke();
    starsCtx.beginPath();
    starsCtx.moveTo(0, -star.size * 2.5);
    starsCtx.lineTo(0, star.size * 2.5);
    starsCtx.stroke();
    starsCtx.beginPath();
    starsCtx.moveTo(-star.size * 1.8, -star.size * 1.8);
    starsCtx.lineTo(star.size * 1.8, star.size * 1.8);
    starsCtx.stroke();
    starsCtx.beginPath();
    starsCtx.moveTo(star.size * 1.8, -star.size * 1.8);
    starsCtx.lineTo(-star.size * 1.8, star.size * 1.8);
    starsCtx.stroke();
    starsCtx.restore();
  }
  function animateStars() {
    starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
    for (const star of stars) {
      star.alpha += star.alphaChange;
      if (star.alpha <= 0.3 || star.alpha >= 1) star.alphaChange = -star.alphaChange;
      star.angle += star.rotationSpeed;
      star.x += star.dx;
      star.y += star.dy;
      if (star.x < 0) star.x = starsCanvas.width;
      if (star.x > starsCanvas.width) star.x = 0;
      if (star.y < 0) star.y = starsCanvas.height;
      if (star.y > starsCanvas.height) star.y = 0;
      drawStar(star);
    }
    requestAnimationFrame(animateStars);
  }
  animateStars();
})();

// Firefly background
(function(){
  const fireflyCanvas = document.getElementById('firefly-bg');
  if (!fireflyCanvas) return;

    fireflyCanvas.width = window.innerWidth;

  }
  resizeFireflyCanvas();
  window.addEventListener('resize', resizeFireflyCanvas);
  const bugs = [...Array(100)].map(() => ({
    x: Math.random() * fireflyCanvas.width,
    y: Math.random() * fireflyCanvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.6,
    dy: (Math.random() - 0.5) * 0.6,
    alpha: Math.random() * 0.5 + 0.5
  }));
  function animateFireflies() {
    fireflyCtx.clearRect(0, 0, fireflyCanvas.width, fireflyCanvas.height);
    bugs.forEach(b => {
      fireflyCtx.beginPath();
      fireflyCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      fireflyCtx.fillStyle = `rgba(255,255,255,${b.alpha})`;
      fireflyCtx.fill();
      b.x += b.dx;
      b.y += b.dy;
      if (b.x < 0 || b.x > fireflyCanvas.width) b.dx *= -1;
      if (b.y < 0 || b.y > fireflyCanvas.height) b.dy *= -1;
    });
    requestAnimationFrame(animateFireflies);
  }
  animateFireflies();
})();

// Blue stars canvas (home bg effect)
(function(){
  const blueStarsCanvas = document.getElementById('blue-stars-canvas');
  if (!blueStarsCanvas) return;
  const blueStarsCtx = blueStarsCanvas.getContext('2d');
  function resizeBlueStarsCanvas() {
    blueStarsCanvas.width = window.innerWidth;
    blueStarsCanvas.height = window.innerHeight;
  }
  resizeBlueStarsCanvas();
  window.addEventListener('resize', resizeBlueStarsCanvas);
  const blueStars = [];
  const blueStarCount = 120;
  for (let i = 0; i < blueStarCount; i++) {
    const speed = (Math.random() * 0.4 + 0.1);
    const angle = Math.random() * 2 * Math.PI;
    blueStars.push({
      x: Math.random() * blueStarsCanvas.width,
      y: Math.random() * blueStarsCanvas.height,
      size: Math.random() * 0.5 + 1.0,
      alpha: Math.random() * 0.5 + 0.6,
      alphaDir: Math.random() > 0.5 ? 1 : -1,
      pulseSpeed: Math.random() * 0.015 + 0.005,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed
    });
  }
  function drawBlueStars() {
    if (!document.getElementById('home-screen')?.style?.display || document.getElementById('home-screen').style.display !== 'none') {
      blueStarsCtx.clearRect(0, 0, blueStarsCanvas.width, blueStarsCanvas.height);
      for (const star of blueStars) {
        star.alpha += star.pulseSpeed * star.alphaDir;
        if (star.alpha <= 0.3 || star.alpha >= 1) star.alphaDir *= -1;
        star.x += star.dx;
        star.y += star.dy;
        if (star.x < -20) star.x = blueStarsCanvas.width + 20;
        if (star.x > blueStarsCanvas.width + 20) star.x = -20;
        if (star.y < -20) star.y = blueStarsCanvas.height + 20;
        if (star.y > blueStarsCanvas.height + 20) star.y = -20;
        const gradient = blueStarsCtx.createRadialGradient(
          star.x, star.y, 0,
          star.x, star.y, star.size * 3
        );
        gradient.addColorStop(0, `rgba(0, 180, 255, ${star.alpha})`);
        gradient.addColorStop(0.3, `rgba(0, 180, 255, ${star.alpha * 0.4})`);
        gradient.addColorStop(1, `rgba(0, 180, 255, 0)`);
        blueStarsCtx.beginPath();
        blueStarsCtx.arc(star.x, star.y, star.size * 6, 0, Math.PI * 2);
        blueStarsCtx.fillStyle = gradient;
        blueStarsCtx.fill();
        blueStarsCtx.beginPath();
        blueStarsCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        blueStarsCtx.fillStyle = `rgba(0, 200, 255, ${star.alpha})`;
        blueStarsCtx.fill();
      }
      requestAnimationFrame(drawBlueStars);
    }
  }
  drawBlueStars();
})();
/* ==== GameLucid Pro MAX: 100% robust, /* =
  #state = {

  #config = {

    ]
  };
  #dom = {};
  #audio = {};

  constructor() {
    this.#cacheDOM();

    this.#bindUI();

    this.#updateScorePanel();
    this.#setupAriaLive();
  }

  // Cache DOM nodes for fast lookup
  #cacheDOM() {

        document.getElementById('lucidPieceImg1'),

      ],
      homeHighScore: document.getElementById('home-high-score'),
      homeCoins: document.getElementById('home-coins'),
      endScreen: document.getElementById('end-screen'),
      finalScore: document.getElementById('final-score'),
      highestScore: document.getElementById('highest-score'),
      buyChanceBtn: document.getElementById('buy-chance-btn'),
      restartBtn: document.getElementById('restart-btn'),
      homeBtn: document.getElementById('home-btn'),
      startBtn: document.getElementById('start-btn'),
      muteBtn: document.getElementById('mute-btn'),
      lucidCoinImage: document.getElementById('lucidCoinImage'),
      // ARIA live region for screen readers

    };
    this.#audio = {
      coin: document.getElementById('coin-sound'),
      wrong: document.getElementById('wrong-sound'),

    };
  }

  // Add ARIA live region if not present
  #setupAriaLive() {
    if (!this.#dom.ariaLive) {
      const live = document.createElement('div');
      live.id = 'aria-live-region';
      live.setAttribute('aria-live', 'polite');
      live.setAttribute('role', 'status');
      live.style.position = 'absolute';
      live.style.left = '-9999px';
      document.body.appendChild(live);
      this.#dom.ariaLive = live;
    }
  }

  // Load game state and settings from localStorage
  #loadPersistent() {
    this.#state.highScore = parseInt(localStorage.getItem('highScore') || '0');
    this.#state.totalCoins = parseInt(localStorage.getItem('totalCoins') || '0');
    this.#state.lucidCoins = parseInt(localStorage.getItem('lucidCoins') || '2');
    this.#isMuted = localStorage.getItem('isMuted') === 'true';
    this.#updateLucidCoinUI();
    this.#updateMuteBtn();
    Object.values(this.#audio).forEach(audio => audio.muted = this.#isMuted);
  }

  // Save game state and settings to localStorage
  #savePersistent() {
    localStorage.setItem('highScore', this.#state.highScore);
    localStorage.setItem('totalCoins', this.#state.totalCoins);
    localStorage.setItem('lucidCoins', this.#state.lucidCoins);
    localStorage.setItem('isMuted', this.#isMuted);
  }

  // Setup event listeners
  #bindUI() {
    this.#dom.startBtn.addEventListener('click', () => this.startGame());
    this.#dom.muteBtn.addEventListener('click', () => this.#toggleMute());
    this.#dom.restartBtn.addEventListener('click', () => this.restartGame());
    this.#dom.homeBtn.addEventListener('click', () => window.location.href = "gamehome.html");
    this.#dom.buyChanceBtn.addEventListener('click', () => this.buyChance());
    // Keyboard navigation for answer buttons
    this.#dom.answers.addEventListener('keydown', e => this.#handleAnswerKeyNav(e));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.#audio.music.pause();
      else if (!this.#isMuted && this.#state.alive) this.#audio.music.play().catch(()=>{});
    });
  }

  #updateHomeScreen() {
    this.#dom.homeHighScore.textContent = this.#state.highScore;
    this.#dom.homeCoins.textContent = this.#state.totalCoins;
    this.#updateLucidCoinUI();
  }
  #updateScorePanel() {
    this.#dom.score.textContent = this.#state.score;
    this.#dom.coins.textContent = this.#state.coins;
    this.#dom.highScore.textContent = this.#state.highScore;
    this.#updateLucidCoinUI();
    // Accessibility: Announce changes
    this.#announce(`Score: ${this.#state.score}, Level: ${this.#state.level}`);
  }
  #updateLucidCoinUI() {
    this.#dom.lucidCoinCount.textContent = this.#state.lucidCoins;
    this.#dom.lucidPieceImgs.forEach((img, i) => {
      img.className = "lucid-piece-slot" + (i < this.#state.lucidPieces ? " lucid-piece-collected" : "");
    });
  }
  #setupBackground() {
    const bg = this.#config.backgrounds[Math.floor(Math.random() * this.#config.backgrounds.length)];
    const dynamicBg = document.getElementById('dynamic-bg');
    if (dynamicBg) dynamicBg.style.backgroundImage = `url('${bg}')`;
  }

  startGame() {
    // === BULLETPROOF: Hide EndScreen, clear timer, and set alive immediately ===
    clearTimeout(this.#state.timer);
    this.#state.alive = true;
    this.#dom.endScreen.style.display = "none";
    this.#dom.endScreen.classList.remove("active");
    this.#state.score = 0;
    this.#state.coins = 0;
    this.#state.level = 1;
    this.#state.lucidPieces = 0;
    this.#updateScorePanel();
    this.#dom.homeScreen.style.display = "none";
    this.#dom.gameScreen.style.display = "block";
    this.#dom.levelBanner.style.display = "none";
    this.#audio.music.currentTime = 0;
    if (!this.#isMuted) this.#playAudio(this.#audio.music, true);
    this.nextQuestion();
  }

  nextQuestion() {
    if (!this.#state.alive) return;
    this.#state.question = this.#generateQuestion(this.#state.level);
    this.#state.correctAnswer = this.#state.question.correct;
    this.#dom.equation.textContent = this.#state.question.text;
    this.#dom.answers.innerHTML = '';
    // Accessibility: Set focus to answers container
    this.#dom.answers.setAttribute('tabindex', '-1');
    this.#dom.answers.focus();
    // Render answer buttons
    this.#state.question.choices.forEach((choice, idx) => {
      const btn = document.createElement('button');
      btn.textContent = choice;
      btn.setAttribute('aria-label', "Answer: " + choice);
      btn.setAttribute('tabindex', '0');
      btn.className = 'answer-btn';
      btn.onclick = () => this.#handleAnswer(choice, btn);
      // For keyboard navigation
      btn.dataset.idx = idx;
      this.#dom.answers.appendChild(btn);
    });
    // Focus first answer for keyboard navigation
    const firstBtn = this.#dom.answers.querySelector('button');
    if (firstBtn) firstBtn.focus();
    this.#startTimer();
  }

  // Improved question generation for higher difficulty and variety
  #generateQuestion(level) {
    let eq = '', correct = 0, choices = [], min=1, max=9, ops = ['+', '-'];
    if (level <= 5) {
      // Simple add/subtract
      eq = `${this.#rand(min,max)} ${this.#pick(ops)} ${this.#rand(min,max)}`;
    } else if (level <= 12) {
      // Three-term add/subtract, may yield negative results
      eq = `${this.#rand(min,max)} ${this.#pick(ops)} ${this.#rand(min,max)} ${this.#pick(ops)} ${this.#rand(min,max)}`;
    } else if (level <= 18) {
      // Introduce multiplication
      ops = ['+', '-', '*'];
      min = 2; max = 15;
      eq = `${this.#rand(min,max)} ${this.#pick(ops)} ${this.#rand(min,max)}`;
    } else if (level <= 24) {
      // Add division, avoid division by zero
      ops = ['+', '-', '*', '/'];
      min = 2; max = 16;
      let a = this.#rand(min,max), b = this.#rand(min,max);
      let op = this.#pick(ops);
      if (op === '/') {
        b = this.#rand(2, max); // no divide by zero, no 1
        a = b * this.#rand(2, Math.floor(max/2)); // ensure integer division for challenge
      }
      eq = `${a} ${op} ${b}`;
    } else {
      // Four terms, mix all ops, larger numbers
      ops = ['+', '-', '*', '/'];
      min = 5; max = 30;
      let a = this.#rand(min,max), b = this.#rand(min,max), c = this.#rand(2,max), d = this.#rand(2,max);
      let op1 = this.#pick(ops), op2 = this.#pick(ops), op3 = this.#pick(ops);
      // For division, ensure integer and no zero
      if (op1 === '/') { b = this.#rand(2, max); a = b * this.#rand(2, Math.floor(max/2)); }
      if (op2 === '/') { c = this.#rand(2, max); b = c * this.#rand(2, Math.floor(max/2)); }
      if (op3 === '/') { d = this.#rand(2, max); c = d * this.#rand(2, Math.floor(max/2)); }
      eq = `${a} ${op1} ${b} ${op2} ${c} ${op3} ${d}`;
    }
    correct = this.#evaluate(eq);
    choices = this.#generateAnswerOptions(correct, this.#config.answersCount, level);
    return {text: eq + " = ?", correct, choices};
  }

  #evaluate(expr) {
    try { 
      // Use Math.floor for division for integer results
      // Replace / with // for integer division in display
      let safeExpr = expr.replace(/\//g, '/');
      let res = Function('return Math.floor(' + safeExpr + ')')();
      return Number.isFinite(res) ? res : 0;
    }
    catch { return 0; }
  }

  // Improved distractor logic for greater variety and challenge
  #generateAnswerOptions(correct, count, level) {
    const set = new Set([correct]);
    let range = Math.max(5, Math.round(Math.abs(correct) * 0.5));
    let tries = 0;
    while (set.size < count && tries < 40) {
      let fake;
      if (level > 12 && Math.random() > 0.5) {
        // At higher levels, sometimes invert sign or use a close value
        fake = correct + this.#rand(-range, range);
      } else {
        fake = correct + this.#rand(-range, range);
      }
      if (fake === correct || set.has(fake) || !Number.isFinite(fake)) {
        tries++; continue;
      }
      set.add(fake);
      tries++;
    }
    // If not enough, pad with random numbers
    while (set.size < count) set.add(correct + this.#rand(-50, 50));
    return Array.from(set).sort(() => Math.random() - 0.5);
  }
  #rand(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
  #pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

  #startTimer() {
    clearTimeout(this.#state.timer);
    const duration = Math.max(this.#config.minTimer, this.#config.baseTimer - this.#state.level * this.#config.timerDecay);
    this.#dom.timerFill.style.transition = 'none';
    this.#dom.timerFill.style.width = '100%';
    setTimeout(() => {
      this.#dom.timerFill.style.transition = `width ${duration}ms linear`;
      this.#dom.timerFill.style.width = '0%';
    }, 10);
    this.#state.timer = setTimeout(() => {
      if (this.#state.alive) this.#timeOut();
    }, duration);
  }

  // Visual feedback for correct/wrong answers, accessibility
  #handleAnswer(choice, btn) {
    if (!this.#state.alive) return;
    clearTimeout(this.#state.timer);
    const isCorrect = (choice === this.#state.correctAnswer);
    if (isCorrect) {
      this.#playAudio(this.#audio.coin);
      this.#state.score++;
      this.#state.coins++;
      this.#state.level++;
      if (this.#state.level % 5 === 1 && this.#state.level > 1) {
        this.#showLevelUp();
      }
      this.#updateScorePanel();
      this.#playCoinAnim();
      setTimeout(()=>this.nextQuestion(), 350);
    } else {
      this.#playAudio(this.#audio.wrong);
      // Visual feedback: shake and red highlight
      if (btn) {
        btn.classList.add('answer-wrong');
        btn.classList.add('shake');
        setTimeout(() => { btn.classList.remove('shake'); btn.classList.remove('answer-wrong'); }, 900);
      }
      setTimeout(()=>this.#endGame(), 600);
    }
  }

  #timeOut() {
    if (!this.#state.alive) return;
    this.#playAudio(this.#audio.wrong);
    this.#endGame();
  }

  #showLevelUp() {
    this.#dom.levelBanner.style.display = 'block';
    setTimeout(() => this.#dom.levelBanner.style.display = 'none', 950);
    this.#announce(`Level up! Now level ${this.#state.level}`);
  }

  #playCoinAnim() {
    for (let i = 0; i < 6; i++) {
      const coin = document.createElement('div');
      coin.className = 'coin-animation';
      coin.style.setProperty('--x', Math.random().toFixed(2));
      document.body.appendChild(coin);
      setTimeout(() => coin.remove(), 1200);
    }
  }

  #endGame() {
    if (!this.#state.alive) return;
    this.#state.alive = false;
    clearTimeout(this.#state.timer);
    this.#audio.music.pause();
    if (this.#state.score > this.#state.highScore) {
      this.#state.highScore = this.#state.score;
    }
    this.#state.totalCoins += this.#state.coins;
    this.#savePersistent();
    this.#updateHomeScreen();
    this.#updateScorePanel();
    this.#showEndScreen();
  }

  #showEndScreen() {
    this.#dom.finalScore.textContent = this.#state.score;
    this.#dom.highestScore.textContent = this.#state.highScore;
    this.#dom.endScreen.style.display = 'flex';
    this.#dom.endScreen.classList.add('active');
  }

  restartGame() {
    this.startGame();
  }

  buyChance() {
    if (this.#state.lucidCoins >= this.#config.lucidCoinCost) {
      this.#state.lucidCoins -= this.#config.lucidCoinCost;
      this.#savePersistent();
      this.#updateLucidCoinUI();
      this.#dom.endScreen.style.display = 'none';
      this.#dom.endScreen.classList.remove("active");
      this.#state.alive = true;
      clearTimeout(this.#state.timer);
      this.nextQuestion();
      if (!this.#isMuted) this.#playAudio(this.#audio.music, true);
    } else {
      this.#showNoLucidCoinPopup();
    }
  }
  #showNoLucidCoinPopup() {
    let popup = document.getElementById('no-lucid-coin-popup');
    if (!popup) {
      popup = document.createElement('div');
      popup.id = 'no-lucid-coin-popup';
      popup.innerHTML = `
        <div style="margin-bottom:1em;font-size:1.12em;">Not enough <img src="/static/lucid_coin_total.png" alt="Lucid Coin" style="width:1.3em;vertical-align:middle"> Lucid Coins!</div>
        <button onclick="this.parentNode.style.display='none'">OK</button>
      `;
      document.body.appendChild(popup);
    }
    popup.style.display = 'block';
  }

  #toggleMute() {
    this.#isMuted = !this.#isMuted;
    this.#updateMuteBtn();
    Object.values(this.#audio).forEach(audio => audio.muted = this.#isMuted);
    if (this.#isMuted) this.#audio.music.pause();
    else if (this.#state.alive) this.#playAudio(this.#audio.music, true);
    this.#savePersistent();
  }
  #updateMuteBtn() {
    this.#dom.muteBtn.innerHTML = `<i class="fas ${this.#isMuted ? 'fa-volume-mute' : 'fa-volume-up'}"></i>`;
  }

  // Accessibility: Announce important changes
  #announce(msg) {
    if (this.#dom.ariaLive) {
      this.#dom.ariaLive.textContent = '';
      setTimeout(() => { this.#dom.ariaLive.textContent = msg; }, 20);
    }
  }

  // Robust audio play
  #playAudio(audio, loop=false) {
    if (!audio) return;
    try {
      audio.loop = !!loop;
      audio.currentTime = 0;
      let playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(()=>{});
      }
    } catch {}
  }

  // Keyboard navigation for answer buttons
  #handleAnswerKeyNav(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      this.#focusAdjacentAnswer(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.#focusAdjacentAnswer(-1);
    } else if (e.key === 'Enter' || e.key === ' ') {
      // Simulate click on focused
      const active = document.activeElement;
      if (active && active.classList.contains('answer-btn')) {
        active.click();
      }
    }
  }
  #focusAdjacentAnswer(dir) {
    const btns = Array.from(this.#dom.answers.querySelectorAll('button'));
    let idx = btns.findIndex(btn => btn === document.activeElement);
    if (idx === -1) idx = 0;
    let nextIdx = (idx + dir + btns.length) % btns.length;
    btns[nextIdx].focus();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  new GameLucidPro();
});

  /* ==== LUCID COIN PIECE SYSTEM ==== */

  // Reset lucid pieces for a new game
  #resetLucidPieces() {
    this.#state.lucidPieces = 0;
    this.#state.collectedPieceIdxs = [];
    this.#updateLucidCoinUI();
    this.#clearLucidPiece();
  }

  // Schedule next Lucid Piece appearance
  #scheduleNextLucidPiece() {
    this.#clearLucidPiece();
    if (!this.#state.alive || this.#state.collectedPieceIdxs.length >= 3) return;
    const delay = this.#rand(this.#config.lucidPieceAppearMin, this.#config.lucidPieceAppearMax);
    this.#state.lucidPieceTimeout = setTimeout(() => this.#spawnLucidPiece(), delay);
  }

  // Actually spawn a Lucid Piece on the screen
  #spawnLucidPiece() {
    if (!this.#state.alive || this.#state.collectedPieceIdxs.length >= 3) return;
    // Find what pieces remain to be collected
    const allIdxs = [0,1,2];
    const available = allIdxs.filter(idx => !this.#state.collectedPieceIdxs.includes(idx));
    if (available.length === 0) return;
    const idx = this.#pick(available); // which piece: 0=blue/top, 1=green/left, 2=yellow/bottom
    const imgSrc = [
      '/static/lucid_piece1.png',
      '/static/lucid_piece2.png',
      '/static/lucid_piece3.png'
    ][idx];
    const altText = [
      'Lucid Piece: Blue (top)',
      'Lucid Piece: Green (left)',
      'Lucid Piece: Yellow (bottom)'
    ][idx];
    // Create DOM node
    const piece = document.createElement('img');
    piece.src = imgSrc;
    piece.alt = altText;
    piece.className = 'lucid-piece lucid-piece-appear lucid-piece-' + (idx+1);
    piece.setAttribute('tabindex', '0');
    piece.setAttribute('aria-label', altText + ', click to collect');
    // Random position within gameContainer (avoid edges)
    const container = this.#dom.gameContainer;
    const rect = container.getBoundingClientRect();
    const size = Math.floor(rect.width * 0.12); // about 12vw
    const pad = Math.max(size, 64); // avoid edges
    const maxX = rect.width - pad, maxY = rect.height - pad;
    const x = this.#rand(pad, maxX);
    const y = this.#rand(pad, maxY);
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    // Animation: Shine, glow, scale-up
    piece.classList.add('lucid-piece-shine');

    // Click to collect
    const collectHandler = (ev) => {
      ev.preventDefault();
      this.#collectLucidPiece(idx, piece);
    };
    piece.addEventListener('click', collectHandler);
    piece.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { collectHandler(e); }
    });

    // Add to DOM
    container.appendChild(piece);

    // Track active piece
    this.#state.lucidPieceActive = {idx, dom: piece, timer: null, miniTimer: null};
    // Play appear sound if available
    this.#playAudio(this.#audio.lucidAppear);

    // Start timer: after (showTotal - miniTimer) show mini-timer, after showTotal, remove
    this.#state.lucidPieceActive.timer = setTimeout(() => {
      this.#showLucidPieceMiniTimer(piece, idx);
      this.#state.lucidPieceActive.miniTimer = setTimeout(() => {
        this.#fadeOutLucidPiece(piece);
        this.#clearLucidPiece();
        this.#scheduleNextLucidPiece();
      }, this.#config.lucidPieceMiniTimer);
    }, this.#config.lucidPieceShowTotal - this.#config.lucidPieceMiniTimer);
  }

  // Show mini-timer on piece for last 4 seconds
  #showLucidPieceMiniTimer(piece, idx) {
    let miniTimer = document.createElement('div');
    miniTimer.className = 'lucid-piece-mini-timer';
    miniTimer.innerHTML = `<div class="mini-timer-bar"></div>`;
    piece.appendChild(miniTimer);
    setTimeout(() => { miniTimer.classList.add('active'); }, 10);
    setTimeout(() => { miniTimer.classList.remove('active'); }, this.#config.lucidPieceMiniTimer);
  }

  // Fade-out and remove piece from DOM
  #fadeOutLucidPiece(piece) {
    piece.classList.remove('lucid-piece-appear');
    piece.classList.add('lucid-piece-disappear');
    setTimeout(() => { if (piece.parentNode) piece.parentNode.removeChild(piece); }, 600);
  }

  // Collect the lucid piece
  #collectLucidPiece(idx, piece) {
    if (this.#state.collectedPieceIdxs.includes(idx)) return; // already collected
    this.#state.collectedPieceIdxs.push(idx);
    this.#state.lucidPieces = this.#state.collectedPieceIdxs.length;
    this.#updateLucidCoinUI();
    piece.classList.add('lucid-piece-collected-anim');
    this.#playAudio(this.#audio.lucidCollect);

    // Animate piece flying to its slot
    const slotImg = this.#dom.lucidPieceImgs[idx];
    const slotRect = slotImg.getBoundingClientRect();
    const pieceRect = piece.getBoundingClientRect();
    const deltaX = slotRect.left + slotRect.width/2 - (pieceRect.left + pieceRect.width/2);
    const deltaY = slotRect.top + slotRect.height/2 - (pieceRect.top + pieceRect.height/2);

    piece.style.transition = 'transform 0.7s cubic-bezier(.54,1.7,.55,.9), opacity 0.7s';
    piece.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.4)`;
    piece.style.opacity = '0.75';
    setTimeout(() => {
      if (piece.parentNode) piece.parentNode.removeChild(piece);
      this.#clearLucidPiece();
      this.#scheduleNextLucidPiece();
      // If all 3 collected, merge into Lucid Coin
      if (this.#state.collectedPieceIdxs.length === 3) {
        this.#awardLucidCoin();
      }
    }, 700);
  }

  // Award the Lucid Coin with animation
  #awardLucidCoin() {
    // Animate all 3 pieces glowing and merging into the main Lucid Coin image
    this.#dom.lucidPieceImgs.forEach(img => {
      img.classList.add('lucid-coin-merge');
      setTimeout(() => img.classList.remove('lucid-coin-merge'), 1000);
    });
    this.#playAudio(this.#audio.lucidFull);
    setTimeout(() => {
      this.#state.lucidCoins += 1;
      this.#resetLucidPieces();
      this.#savePersistent();
      this.#updateLucidCoinUI();
      this.#announce('You earned a Lucid Coin!');
      // Next piece spawn will wait after animation completes
      this.#scheduleNextLucidPiece();
    }, 1000);
  }

  // Clear lucid piece timers and DOM
  #clearLucidPiece() {
    if (this.#state.lucidPieceTimeout) clearTimeout(this.#state.lucidPieceTimeout);
    if (this.#state.lucidPieceActive) {
      if (this.#state.lucidPieceActive.timer) clearTimeout(this.#state.lucidPieceActive.timer);
      if (this.#state.lucidPieceActive.miniTimer) clearTimeout(this.#state.lucidPieceActive.miniTimer);
      const dom = this.#state.lucidPieceActive.dom;
      if (dom && dom.parentNode) dom.parentNode.removeChild(dom);
    }
    this.#state.lucidPieceTimeout = null;
    this.#state.lucidPieceActive = null;
  }
}
